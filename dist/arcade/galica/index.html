<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GALICA — Arcade Shooter</title>
  <meta name="description" content="GALICA — a free browser arcade shooter in the Brain Lounge: four scrolling sectors, boss waves, capture-and-rescue runs, ship upgrades and a saved high score.">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#020408; --accent:#00ffaa; --glow:rgba(0,255,170,0.15); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:var(--bg); font-family:'Press Start 2P',monospace; }
  body{ display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 30%, #0a1210 0%, var(--bg) 70%); }
  #wrap{ position:relative; line-height:0; }
  canvas{ display:block; image-rendering:auto; border:2px solid #0d2a1f; border-radius:8px; box-shadow:0 0 50px var(--glow),0 0 100px rgba(0,255,170,0.05),inset 0 0 40px rgba(0,0,0,0.8); }
  .scanlines{ position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:8px; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);z-index:10; }
  .vignette{ position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:8px; background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.6) 100%);z-index:11; }
  #touch{ display:none; position:fixed;bottom:12px;left:0;right:0;padding:0 16px;z-index:20;justify-content:space-between;align-items:flex-end; }
  @media(pointer:coarse){ #touch{display:flex;} }
  .tbtn{ width:60px;height:60px;border-radius:50%;background:rgba(0,255,170,0.1);border:2px solid rgba(0,255,170,0.25);color:var(--accent);font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;transition:background .1s; }
  .tbtn:active{ background:rgba(0,255,170,0.3); }
  .tbtn.fire{ width:76px;height:76px;font-size:10px;letter-spacing:1px; }
  .tbtn.bomb{ background:rgba(255,100,50,0.1);border-color:rgba(255,100,50,0.25);color:#ff6633; }
  #info{ position:fixed;bottom:6px;left:50%;transform:translateX(-50%);color:#2a4a3a;font-size:7px;font-family:'Press Start 2P',monospace;pointer-events:none;z-index:5;text-align:center; }
  @media(pointer:coarse){ #info{display:none;} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>
</div>
<div id="touch">
  <div style="display:flex;gap:12px">
    <button class="tbtn" id="bL">&#9664;</button>
    <button class="tbtn" id="bR">&#9654;</button>
  </div>
  <div style="display:flex;gap:12px;align-items:flex-end">
    <button class="tbtn bomb" id="bB">BOMB</button>
    <button class="tbtn fire" id="bF">FIRE</button>
  </div>
</div>
<div id="info">ARROWS Move · Z/SPACE Fire · X/SHIFT Bomb · KEYS DEAD? CLICK THE GAME FIRST</div>
<script>
const GW=420, GH=640;
const cv=document.getElementById('c'), cx=cv.getContext('2d');
cv.width=GW; cv.height=GH;
function resize(){const mW=window.innerWidth*(matchMedia('(pointer:coarse)').matches?.95:.48);const mH=window.innerHeight*(matchMedia('(pointer:coarse)').matches?.72:.88);const s=Math.min(mW/GW,mH/GH);cv.style.width=(GW*s|0)+'px';cv.style.height=(GH*s|0)+'px';}
resize(); window.addEventListener('resize',resize);

/* ================= ZONES ================= */
const ZONES=[
  {name:'SECTOR 1: DEEP SPACE', gridCol:'#00ffaa', starBase:[210,235,255], bg:'#020408', bossCol:'#44ff44',
   atmo:'rgba(120,180,255,', pLight:'#9fd8ff', pMid:'#2e7bb5', pDark:'#0a2540', surf:'rgba(70,160,100,.35)', neb:['rgba(0,80,60,','rgba(80,0,50,','rgba(0,40,80,']},
  {name:'SECTOR 2: INFERNO', gridCol:'#ff4400', starBase:[255,205,160], bg:'#080204', bossCol:'#ff8800',
   atmo:'rgba(255,120,50,', pLight:'#ffcf9e', pMid:'#e05a1e', pDark:'#5a1005', surf:'rgba(120,30,8,.5)', neb:['rgba(80,30,0,','rgba(100,0,0,','rgba(80,60,0,']},
  {name:'SECTOR 3: QUANTUM VOID', gridCol:'#cc00ff', starBase:[232,205,255], bg:'#040208', bossCol:'#ff00ff',
   atmo:'rgba(190,120,255,', pLight:'#e3c2ff', pMid:'#8a3fd9', pDark:'#2a0a4a', surf:'rgba(255,255,255,.08)', neb:['rgba(60,0,80,','rgba(0,40,80,','rgba(80,0,60,']},
  {name:'SECTOR 4: CYBER DIMENSION', gridCol:'#dfff00', starBase:[255,255,220], bg:'#040402', bossCol:'#eaff30',
   atmo:'rgba(230,255,90,', pLight:'#f2ffb0', pMid:'#b7d92e', pDark:'#3a4d08', surf:'rgba(20,30,0,.4)', neb:['rgba(80,80,0,','rgba(0,80,40,','rgba(40,40,0,']}
];
let currentZone=0;

/* ================= SHIP DATA (physics) ================= */
const SHIP_DEFS=[
  {name:'FALCON', desc:'BALANCED', col:'#00ffcc', accel:.55, drag:.12, spd:4.5, maxHp:3, maxBombs:1, rate:8, maxB:6, heat:6,
   weps:[[{x:0,y:-14,vy:-8,vx:0}],[{x:-4,y:-14,vy:-8,vx:0},{x:4,y:-14,vy:-8,vx:0}],[{x:0,y:-14,vy:-9,vx:0},{x:-8,y:-10,vy:-8,vx:-1.5},{x:8,y:-10,vy:-8,vx:1.5}],[{x:-4,y:-14,vy:-9,vx:0},{x:4,y:-14,vy:-9,vx:0},{x:-10,y:-8,vy:-8,vx:-2},{x:10,y:-8,vy:-8,vx:2}]]},
  {name:'VIPER', desc:'FAST & RAPID', col:'#ffe93d', accel:.85, drag:.14, spd:6, maxHp:2, maxBombs:1, rate:4, maxB:8, heat:3.2,
   weps:[[{x:0,y:-12,vy:-10,vx:0}],[{x:-3,y:-12,vy:-10,vx:0},{x:3,y:-12,vy:-10,vx:0}],[{x:-3,y:-12,vy:-10,vx:0},{x:3,y:-12,vy:-10,vx:0},{x:0,y:-14,vy:-11,vx:0}],[{x:-3,y:-12,vy:-10,vx:0},{x:3,y:-12,vy:-10,vx:0},{x:-8,y:-8,vy:-9,vx:-1},{x:8,y:-8,vy:-9,vx:1}]]},
  {name:'TITAN', desc:'HEAVY TANK', col:'#ff8a3d', accel:.4, drag:.13, spd:3, maxHp:5, maxBombs:3, rate:12, maxB:4, heat:9,
   weps:[[{x:0,y:-14,vy:-7,vx:0,sz:4}],[{x:-6,y:-12,vy:-7,vx:0,sz:3},{x:6,y:-12,vy:-7,vx:0,sz:3}],[{x:0,y:-14,vy:-8,vx:0,sz:5},{x:-10,y:8,vy:7,vx:-1,sz:2},{x:10,y:8,vy:7,vx:1,sz:2}],[{x:-6,y:-14,vy:-8,vx:0,sz:4},{x:6,y:-14,vy:-8,vx:0,sz:4},{x:-12,y:8,vy:7,vx:-2,sz:2},{x:12,y:8,vy:7,vx:2,sz:2}]]}
];
const SHOP_ITEMS=[
  {name:'HULL REPAIR', key:'repair', cost:1500, max:99},
  {name:'MAX HULL +1', key:'hp', cost:5000, max:5},
  {name:'MAX BOMB +1', key:'bomb', cost:3000, max:5},
  {name:'THRUSTERS +1', key:'spd', cost:2000, max:5},
  {name:'MAGNET +1', key:'mag', cost:4000, max:3}
];
let upgrades={hp:0,bomb:0,spd:0,mag:0}, shopIdx=0, buyLock=false, navLock=false;

/* ================= AUDIO ================= */
let ac=null, hum=null;
function ensureAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;return;}}if(ac.state==='suspended'){try{ac.resume();}catch(e){}}}
function startHum(){if(!ac||hum)return;try{const o1=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o1.type='sawtooth';o1.frequency.value=36;o2.type='sawtooth';o2.frequency.value=55;f.type='lowpass';f.frequency.value=180;
  g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(ac.destination);o1.start();o2.start();hum={g};}catch(e){hum=null;}}
function setHum(v){if(hum&&ac){try{hum.g.gain.setTargetAtTime(v,ac.currentTime,.08);}catch(e){}}}
function noiseBurst(dur,cut,vol){if(!ac)return;try{const t=ac.currentTime,len=(ac.sampleRate*dur)|0;if(len<1)return;
  const buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,cut*.2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);}catch(e){}}
function snd(type){if(!ac)return;const t=ac.currentTime;let o,g;
  try{o=ac.createOscillator();g=ac.createGain();o.connect(g);g.connect(ac.destination);}catch(e){return;}
  try{
  if(type==='boss'){o.type='sawtooth';o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(40,t+.6);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.start(t);o.stop(t+.6);noiseBurst(.8,300,.25);return;}
  if(type==='bomb'){noiseBurst(1.1,180,.4);return;}
  if(type==='hit'){noiseBurst(.16,1100,.2);o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(60,t+.12);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.12);return;}
  if(type==='die'){noiseBurst(.7,350,.32);o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(25,t+.55);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.start(t);o.stop(t+.55);return;}
  if(type==='warp'){o.type='sine';o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(2200,t+1.4);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+1.5);o.start(t);o.stop(t+1.5);noiseBurst(1.2,900,.12);return;}
  if(type==='combo'){o.type='square';o.frequency.setValueAtTime(600+combo*40,t);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.start(t);o.stop(t+.09);return;}
  if(type==='buy'){o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(1500,t+.1);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2);return;}
  if(type==='perfect'){[1047,1319,1568,2093].forEach((f,i)=>{const oo=ac.createOscillator(),gg=ac.createGain();oo.connect(gg);gg.connect(ac.destination);oo.type='square';oo.frequency.setValueAtTime(f,t+i*.12);gg.gain.setValueAtTime(.1,t+i*.12);gg.gain.exponentialRampToValueAtTime(.001,t+i*.12+.15);oo.start(t+i*.12);oo.stop(t+i*.12+.15);});return;}
  switch(type){
    case'shoot':o.type='square';o.frequency.setValueAtTime(1200,t);o.frequency.exponentialRampToValueAtTime(600,t+.06);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.start(t);o.stop(t+.06);noiseBurst(.05,2500,.05);break;
    case'dive':o.type='sine';o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(550,t+.12);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.12);break;
    case'wave':{[523,659,784,1047].forEach((f,i)=>{const oo=ac.createOscillator(),gg=ac.createGain();oo.connect(gg);gg.connect(ac.destination);oo.type='square';oo.frequency.setValueAtTime(f,t+i*.1);gg.gain.setValueAtTime(.07,t+i*.1);gg.gain.exponentialRampToValueAtTime(.001,t+i*.1+.13);oo.start(t+i*.1);oo.stop(t+i*.1+.13);});return;}
    case'bonus':o.type='square';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1100,t+.06);o.frequency.setValueAtTime(1320,t+.12);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2);break;
    case'powerup':o.type='square';o.frequency.setValueAtTime(440,t);o.frequency.exponentialRampToValueAtTime(1760,t+.15);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2);break;
  }}catch(e){}}

/* ================= INPUT (v2: bulletproof — e.key fallback when e.code missing, focus grab for embedded
   previews, capture-phase listeners, stuck-key purge on blur) ================= */
const keys={};let gotKey=false;
const KEY_ALIAS={' ':'Space',Spacebar:'Space',Left:'ArrowLeft',Right:'ArrowRight',Up:'ArrowUp',Down:'ArrowDown',a:'KeyA',d:'KeyD',w:'KeyW',s:'KeyS',z:'KeyZ',x:'KeyX',Esc:'Escape'};
const KC_ALIAS={32:'Space',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',65:'KeyA',68:'KeyD',87:'KeyW',83:'KeyS',90:'KeyZ',88:'KeyX',13:'Enter',27:'Escape'};
function normKey(e){let c=e.code;
  if(!c||c==='Unidentified')c=KEY_ALIAS[e.key]||e.key;          /* tier 2: key name */
  if(!c||c==='Unidentified'){const k=e.keyCode||e.which;        /* tier 3: legacy keyCode (old WebViews) */
    if(k&&KC_ALIAS[k])c=KC_ALIAS[k];
    else if(k>=65&&k<=90)c='Key'+String.fromCharCode(k);}
  if(c==='NumpadEnter')c='Enter';
  return c;}
function pressKey(c){if(!c)return;keys[c]=true;gotKey=true;ensureAudio();startHum();}
const GAME_KEYS=['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
function onKeyDown(e){const c=normKey(e);pressKey(c);if(GAME_KEYS.includes(c))e.preventDefault();}
function onKeyUp(e){const c=normKey(e);if(c)keys[c]=false;}
window.addEventListener('keydown',onKeyDown,true);document.addEventListener('keydown',onKeyDown,true);
window.addEventListener('keyup',onKeyUp,true);document.addEventListener('keyup',onKeyUp,true);
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const k in keys)keys[k]=false;});
/* embedded previews: keystrokes only reach this frame after it is clicked/focused */
document.body.setAttribute('tabindex','0');
function grabFocus(){try{window.focus();document.body.focus({preventScroll:true});}catch(e){}ensureAudio();startHum();}
window.addEventListener('pointerdown',grabFocus,true);
window.addEventListener('touchstart',grabFocus,true);
window.addEventListener('load',grabFocus);
grabFocus();
const ts={l:false,r:false,f:false,b:false};
function tb(id,k){const b=document.getElementById(id);if(!b)return;
  b.addEventListener('touchstart',e=>{e.preventDefault();ts[k]=true;ensureAudio();startHum();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();ts[k]=false;},{passive:false});
  b.addEventListener('touchcancel',()=>{ts[k]=false;});
  b.addEventListener('pointerdown',e=>{e.preventDefault();ts[k]=true;ensureAudio();startHum();});
  b.addEventListener('pointerup',()=>{ts[k]=false;});
  b.addEventListener('pointerleave',()=>{ts[k]=false;});}
tb('bL','l');tb('bR','r');tb('bF','f');tb('bB','b');

/* ================= SPRITE FACTORY ================= */
function mkCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);return c;}
function hexA(h,a){const n=parseInt(h.slice(1),16);return'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

const SPR={ships:[]};
function mkShipSprite(t){return mkCanvas(72,72,g=>{g.translate(36,36);
  if(t===0){ // FALCON
    let wg=g.createLinearGradient(0,-10,0,24);wg.addColorStop(0,'#12a386');wg.addColorStop(1,'#052e26');
    g.fillStyle=wg;g.beginPath();g.moveTo(-5,-2);g.lineTo(-26,16);g.lineTo(-22,25);g.lineTo(-7,11);g.closePath();g.fill();
    g.beginPath();g.moveTo(5,-2);g.lineTo(26,16);g.lineTo(22,25);g.lineTo(7,11);g.closePath();g.fill();
    g.fillStyle='#7dffe0';g.fillRect(-25,19,3,3);g.fillRect(22,19,3,3);
    wg=g.createLinearGradient(-9,0,9,0);wg.addColorStop(0,'#093f36');wg.addColorStop(.45,'#17b595');wg.addColorStop(.55,'#37f0c2');wg.addColorStop(1,'#07352d');
    g.fillStyle=wg;g.beginPath();g.moveTo(0,-26);g.lineTo(6,-10);g.lineTo(8,10);g.lineTo(5,22);g.lineTo(-5,22);g.lineTo(-8,10);g.lineTo(-6,-10);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1;g.beginPath();g.moveTo(0,-22);g.lineTo(0,20);g.stroke();
    g.beginPath();g.moveTo(-7,-4);g.lineTo(-6,14);g.moveTo(7,-4);g.lineTo(6,14);g.stroke();
    const cg=g.createRadialGradient(-1,-12,1,0,-9,7);cg.addColorStop(0,'#eafffb');cg.addColorStop(.4,'#59e6ff');cg.addColorStop(1,'#0a5d80');
    g.fillStyle=cg;g.beginPath();g.ellipse(0,-9,3.5,6.5,0,0,7);g.fill();
    g.fillStyle='#152420';g.fillRect(-5,21,10,4);g.fillStyle='rgba(0,255,210,.9)';g.fillRect(-3,22,6,2);
  }else if(t===1){ // VIPER
    let wg=g.createLinearGradient(0,-8,0,22);wg.addColorStop(0,'#9a8a10');wg.addColorStop(1,'#3d3505');
    g.fillStyle=wg;g.beginPath();g.moveTo(-4,-4);g.lineTo(-25,13);g.lineTo(-19,19);g.lineTo(-4,7);g.closePath();g.fill();
    g.beginPath();g.moveTo(4,-4);g.lineTo(25,13);g.lineTo(19,19);g.lineTo(4,7);g.closePath();g.fill();
    g.fillStyle='#c9b83a';g.beginPath();g.moveTo(-3,13);g.lineTo(-11,25);g.lineTo(-2,20);g.closePath();g.fill();
    g.beginPath();g.moveTo(3,13);g.lineTo(11,25);g.lineTo(2,20);g.closePath();g.fill();
    wg=g.createLinearGradient(-5,0,5,0);wg.addColorStop(0,'#6e5e04');wg.addColorStop(.5,'#ffef6e');wg.addColorStop(1,'#5e5003');
    g.fillStyle=wg;g.beginPath();g.moveTo(0,-28);g.lineTo(4,-8);g.lineTo(5,12);g.lineTo(3,22);g.lineTo(-3,22);g.lineTo(-5,12);g.lineTo(-4,-8);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;g.beginPath();g.moveTo(0,-24);g.lineTo(0,20);g.stroke();
    const cg=g.createRadialGradient(-1,-14,1,0,-12,5);cg.addColorStop(0,'#fffbe0');cg.addColorStop(.45,'#ffab3d');cg.addColorStop(1,'#7a3200');
    g.fillStyle=cg;g.beginPath();g.ellipse(0,-12,2.5,5.5,0,0,7);g.fill();
    g.fillStyle='#1c1a10';g.fillRect(-3,21,6,4);g.fillStyle='rgba(255,210,61,.95)';g.fillRect(-1.5,22,3,2);
  }else{ // TITAN
    let wg=g.createLinearGradient(0,-6,0,24);wg.addColorStop(0,'#9a4312');wg.addColorStop(1,'#331104');
    g.fillStyle=wg;g.beginPath();g.moveTo(-6,-2);g.lineTo(-28,12);g.lineTo(-26,21);g.lineTo(-8,13);g.closePath();g.fill();
    g.beginPath();g.moveTo(6,-2);g.lineTo(28,12);g.lineTo(26,21);g.lineTo(8,13);g.closePath();g.fill();
    g.fillStyle='rgba(255,180,120,.3)';g.fillRect(-24,14,14,2);g.fillRect(10,14,14,2);
    wg=g.createLinearGradient(-12,0,12,0);wg.addColorStop(0,'#5e2404');wg.addColorStop(.5,'#ff8a3d');wg.addColorStop(1,'#4a1c03');
    g.fillStyle=wg;g.beginPath();g.moveTo(0,-24);g.lineTo(10,-8);g.lineTo(12,10);g.lineTo(7,22);g.lineTo(-7,22);g.lineTo(-12,10);g.lineTo(-10,-8);g.closePath();g.fill();
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;g.beginPath();g.moveTo(-8,2);g.lineTo(8,2);g.moveTo(-6,10);g.lineTo(6,10);g.stroke();
    const cg=g.createRadialGradient(-1,-11,1,0,-10,5);cg.addColorStop(0,'#fff6d8');cg.addColorStop(.5,'#ffd23d');cg.addColorStop(1,'#7a3a00');
    g.fillStyle=cg;g.beginPath();g.ellipse(0,-10,4,4.5,0,0,7);g.fill();
    g.fillStyle='#1c1208';g.fillRect(-9,21,7,5);g.fillRect(2,21,7,5);
    g.fillStyle='rgba(255,150,61,.95)';g.fillRect(-7.5,22,4,3);g.fillRect(3.5,22,4,3);
  }});}
for(let i=0;i<3;i++)SPR.ships.push(mkShipSprite(i));

/* Enemy sprites: 12 wing phases each */
const EPH=12, ESPR={bee:[],butt:[],tank:[],split:[],bossE:[],bossEd:[]};
function mkEnemySprite(type,ph,dmg){const wing=Math.sin(ph/EPH*Math.PI*2);return mkCanvas(56,56,g=>{g.translate(28,28);
  const W=Math.abs(wing)*3+1;
  if(type==='bee'||type==='split'){
    let wg=g.createRadialGradient(-3,-4,1,0,0,12);wg.addColorStop(0,'#ffe07a');wg.addColorStop(.6,'#f09000');wg.addColorStop(1,'#7a3f00');
    let wgr=g.createLinearGradient(-14,-6,14,6);wgr.addColorStop(0,'#fff3c4');wgr.addColorStop(1,'#c98a1e');
    g.fillStyle=wgr;g.beginPath();g.ellipse(-10,-2-W,6,4,-.35,0,7);g.fill();g.beginPath();g.ellipse(10,-2+W,6,4,.35,0,7);g.fill();
    g.fillStyle=wg;g.beginPath();g.ellipse(0,0,9,7,0,0,7);g.fill();
    g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;g.beginPath();g.moveTo(0,-6);g.lineTo(0,6);g.stroke();
    g.strokeStyle='#5a3000';g.beginPath();g.moveTo(-3,-6);g.lineTo(-6,-12);g.moveTo(3,-6);g.lineTo(6,-12);g.stroke();
    g.fillStyle='#fff';g.fillRect(-4,-5,3,3);g.fillRect(1,-5,3,3);g.fillStyle='#111';g.fillRect(-3,-4,1,1);g.fillRect(2,-4,1,1);
    if(type==='split'){g.fillStyle='#ff2df0';g.fillRect(-6,2,12,2.5);g.strokeStyle='#ff2df0';g.beginPath();g.moveTo(-3,6);g.lineTo(-6,11);g.moveTo(3,6);g.lineTo(6,11);g.stroke();}
  }else if(type==='butt'||type==='tank'){
    let wg=g.createRadialGradient(-2,-4,1,0,0,12);wg.addColorStop(0,'#ff8fae');wg.addColorStop(.6,'#d81f4e');wg.addColorStop(1,'#6a0a20');
    g.fillStyle='#ffb3c8';g.beginPath();g.ellipse(-11,-W,9,5,-.4,0,7);g.fill();g.beginPath();g.ellipse(11,W,9,5,.4,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-11,-W,4.5,2.4,-.4,0,7);g.fill();g.beginPath();g.ellipse(11,W,4.5,2.4,.4,0,7);g.fill();
    g.fillStyle=wg;g.beginPath();g.ellipse(0,0,7,9,0,0,7);g.fill();
    g.strokeStyle='rgba(0,0,0,.3)';g.beginPath();g.moveTo(0,-7);g.lineTo(0,7);g.stroke();
    g.fillStyle='#fff';g.fillRect(-3,-5,2,2);g.fillRect(1,-5,2,2);
    if(type==='tank'){
      const sg=g.createLinearGradient(0,6,0,16);sg.addColorStop(0,'#9fe4ff');sg.addColorStop(1,'#0a6d9e');
      g.fillStyle=sg;g.beginPath();g.moveTo(-10,6);g.quadraticCurveTo(0,18,10,6);g.lineTo(8,4);g.quadraticCurveTo(0,13,-8,4);g.closePath();g.fill();
      g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.beginPath();g.moveTo(-8,6);g.quadraticCurveTo(0,15,8,6);g.stroke();}
  }else{
    const c1=dmg?'#ffc2a8':'#8dffa8', c2=dmg?'#a83018':'#0f8a3a', c3=dmg?'#5a1208':'#064a20';
    let wg=g.createRadialGradient(-3,-4,2,0,0,13);wg.addColorStop(0,c1);wg.addColorStop(.6,c2);wg.addColorStop(1,c3);
    g.fillStyle=wg;g.beginPath();g.ellipse(0,0,11,10,0,0,7);g.fill();
    g.fillStyle=dmg?'#7a1e0e':'#0c6e2c';
    g.beginPath();g.moveTo(-7,-9);g.lineTo(-11,-17+W);g.lineTo(-3,-7);g.closePath();g.fill();
    g.beginPath();g.moveTo(7,-9);g.lineTo(11,-17-W);g.lineTo(3,-7);g.closePath();g.fill();
    g.beginPath();g.moveTo(-13,2);g.lineTo(-19,-4+W);g.lineTo(-11,7);g.closePath();g.fill();
    g.beginPath();g.moveTo(13,2);g.lineTo(19,-4-W);g.lineTo(11,7);g.closePath();g.fill();
    g.fillStyle='#fff';g.fillRect(-5,-5,4,4);g.fillRect(1,-5,4,4);
    g.fillStyle=dmg?'#ff0000':'#0a2a10';g.fillRect(-4,-4,2,2);g.fillRect(2,-4,2,2);
  }});}
(function(){for(const t of ['bee','butt','tank','split','bossE','bossEd'])for(let p=0;p<EPH;p++)ESPR[t].push(mkEnemySprite(t==='bossEd'?'bossE':t,p,t==='bossEd'));})();

/* FX sprites */
const FIRE_SPR=mkCanvas(64,64,g=>{const r=g.createRadialGradient(32,32,1,32,32,30);r.addColorStop(0,'#ffffff');r.addColorStop(.22,'#ffe8a0');r.addColorStop(.5,'#ff9a2e');r.addColorStop(.78,'rgba(200,40,0,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);});
const SMOKE_SPR=mkCanvas(64,64,g=>{const r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(80,80,86,.55)');r.addColorStop(1,'rgba(40,40,44,0)');g.fillStyle=r;g.fillRect(0,0,64,64);});
const FLASH_SPR=mkCanvas(64,64,g=>{const r=g.createRadialGradient(32,32,1,32,32,30);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.4,'rgba(255,250,220,.8)');r.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=r;g.fillRect(0,0,64,64);});

/* Pre-rendered tracers (FIX: no per-frame gradients/shadows on bullets) */
function mkTracer(col){return mkCanvas(56,14,g=>{g.globalCompositeOperation='lighter';
  const gr=g.createLinearGradient(0,0,50,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.7,col);gr.addColorStop(1,'#ffffff');
  g.fillStyle=gr;g.fillRect(0,5,50,4);
  const gl=g.createRadialGradient(50,7,0,50,7,7);gl.addColorStop(0,'#ffffff');gl.addColorStop(.35,col);gl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gl;g.beginPath();g.arc(50,7,7,0,7);g.fill();});}
const TRACERS=SHIP_DEFS.map(d=>mkTracer(d.col));
const EBUL_SPR=mkCanvas(20,20,g=>{g.globalCompositeOperation='lighter';
  const gl=g.createRadialGradient(10,10,0,10,10,10);gl.addColorStop(0,'#ffffff');gl.addColorStop(.25,'#ffd9a8');gl.addColorStop(.55,'#ff7733');gl.addColorStop(1,'rgba(255,60,0,0)');
  g.fillStyle=gl;g.fillRect(0,0,20,20);});

/* Planets per zone */
const PLANETS=[];
function mkPlanet(z){return mkCanvas(280,280,g=>{const cxp=140,cyp=140,R=96,Z=ZONES[z];
  let a=g.createRadialGradient(cxp,cyp,R*.82,cxp,cyp,R*1.32);a.addColorStop(0,Z.atmo+'.5)');a.addColorStop(1,Z.atmo+'0)');
  g.fillStyle=a;g.beginPath();g.arc(cxp,cyp,R*1.32,0,7);g.fill();
  if(z===3){g.strokeStyle='rgba(216,242,122,.55)';g.lineWidth=7;g.beginPath();g.ellipse(cxp,cyp,R*1.5,R*.42,-.28,Math.PI,Math.PI*2);g.stroke();}
  let s=g.createRadialGradient(cxp-R*.42,cyp-R*.42,R*.1,cxp,cyp,R*1.15);
  s.addColorStop(0,Z.pLight);s.addColorStop(.55,Z.pMid);s.addColorStop(1,Z.pDark);
  g.fillStyle=s;g.beginPath();g.arc(cxp,cyp,R,0,7);g.fill();
  g.save();g.beginPath();g.arc(cxp,cyp,R,0,7);g.clip();
  g.fillStyle=Z.surf;
  if(z===2){for(let i=0;i<6;i++){g.globalAlpha=.5;g.fillRect(cxp-R,cyp-R+i*33+((i%2)*10),R*2,10);}}
  else{const rs=[];for(let i=0;i<9;i++){const ang=Math.random()*7,d=(0.15+Math.random()*.75)*R;rs.push({x:cxp+Math.cos(ang)*d,y:cyp+Math.sin(ang)*d,r:8+Math.random()*22});}
    for(const r of rs){g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.fill();}}
  g.globalAlpha=1;
  const t=g.createRadialGradient(cxp+R*.55,cyp+R*.55,R*.2,cxp,cyp,R*1.05);t.addColorStop(0,'rgba(0,0,10,.55)');t.addColorStop(.6,'rgba(0,0,10,0)');
  g.fillStyle=t;g.fillRect(cxp-R,cyp-R,R*2,R*2);
  g.restore();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;g.beginPath();g.arc(cxp,cyp,R-1,Math.PI*.85,Math.PI*1.45);g.stroke();
  if(z===3){g.strokeStyle='rgba(216,242,122,.75)';g.lineWidth=7;g.beginPath();g.ellipse(cxp,cyp,R*1.5,R*.42,-.28,0,Math.PI);g.stroke();}
});}
for(let i=0;i<ZONES.length;i++)PLANETS.push(mkPlanet(i));

/* Nebula clouds per zone */
const NEBS=[];
function mkNeb(z){return mkCanvas(420,420,g=>{const Z=ZONES[z];for(let i=0;i<8;i++){
  const x=90+Math.random()*240,y=90+Math.random()*240,r=60+Math.random()*130;
  const gr=g.createRadialGradient(x,y,4,x,y,r);gr.addColorStop(0,Z.neb[i%3]+'.06)');gr.addColorStop(1,Z.neb[i%3]+'0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}});}
for(let i=0;i<ZONES.length;i++)NEBS.push([mkNeb(i),mkNeb(i),mkNeb(i)]);

/* Asteroid sprites */
const ASTS=[];
for(let v=0;v<6;v++){ASTS.push(mkCanvas(84,84,g=>{g.translate(42,42);const n=8+(Math.random()*4|0),verts=[];
  for(let i=0;i<n;i++){const a=i/n*6.283,r=13+Math.random()*17;verts.push({x:Math.cos(a)*r,y:Math.sin(a)*r});}
  const wg=g.createLinearGradient(-18,-16,18,20);wg.addColorStop(0,'#93857a');wg.addColorStop(.5,'#5a4f44');wg.addColorStop(1,'#211c17');
  g.fillStyle=wg;g.beginPath();g.moveTo(verts[0].x,verts[0].y);for(let i=1;i<n;i++)g.lineTo(verts[i].x,verts[i].y);g.closePath();g.fill();
  g.strokeStyle='rgba(170,155,132,.45)';g.lineWidth=1.5;g.stroke();
  for(let i=0;i<3;i++){const a=Math.random()*7,d=Math.random()*14;const crx=Math.cos(a)*d,cry=Math.sin(a)*d,cr=2+Math.random()*4;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(crx,cry,cr,cr*.75,a,0,7);g.fill();
    g.strokeStyle='rgba(255,240,220,.12)';g.beginPath();g.arc(crx,cry,cr,Math.PI*.9,Math.PI*1.6);g.stroke();}
}));}

/* ================= BACKGROUND ================= */
const stars=[];for(let i=0;i<230;i++){const z=[.3,.65,1.15][i%3];stars.push({x:Math.random()*GW,y:Math.random()*GH,z,b:.3+Math.random()*.7,ph:Math.random()*100,big:Math.random()<.08});}
const dust=[];for(let i=0;i<16;i++)dust.push({x:Math.random()*GW,y:Math.random()*GH,z:2.3,len:10+Math.random()*16,a:.04+Math.random()*.07});
let planet={x:GW*.7,y:-60};
const nebPos=[];for(let i=0;i<3;i++)nebPos.push({x:Math.random()*GW-100,y:Math.random()*GH-100,v:.1+Math.random()*.12,i});
/* REALISM: asteroids are solid — destructible (hp), flash when hit, can be rammed, block fire */
const asteroids=[];function mkAst(y){const s=.45+Math.random()*1;return{x:Math.random()*GW,y:y!==undefined?y:-60,vx:(Math.random()-.5)*.3,vy:.25+Math.random()*.8,rot:Math.random()*7,rv:(Math.random()-.5)*.015,s,hp:s>.95?2:1,flash:0,vi:(Math.random()*6)|0};}
for(let i=0;i<8;i++)asteroids.push(mkAst(Math.random()*GH));
let gridY=0;
function updBg(){for(const s of stars){s.y+=s.z*.55;if(s.y>GH){s.y=-2;s.x=Math.random()*GW;}}
  for(const d of dust){d.y+=d.z*.55*2.4;if(d.y>GH){d.y=-d.len;d.x=Math.random()*GW;}}
  planet.y+=.05;if(planet.y>GH+180){planet.y=-190;planet.x=60+Math.random()*(GW-120);}
  for(const n of nebPos){n.y+=n.v;if(n.y>GH)n.y=-440;}
  for(let i=asteroids.length-1;i>=0;i--){const a=asteroids[i];a.x+=a.vx;a.y+=a.vy;a.rot+=a.rv;if(a.flash>0)a.flash--;if(a.y>GH+70){asteroids.splice(i,1);asteroids.push(mkAst());}}}
function drwBg(menu){const Z=ZONES[currentZone];
  cx.globalCompositeOperation='lighter';cx.globalAlpha=.6;
  for(const n of nebPos)cx.drawImage(NEBS[currentZone][n.i],n.x,n.y);
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  const px=planet.x-(pl.x-GW/2)*.03;
  cx.drawImage(PLANETS[currentZone],px-140,planet.y-140);
  const now=performance.now()*.002,sb=Z.starBase;
  for(const s of stars){const a=s.b*(.55+.45*Math.sin(now+s.ph));
    if(s.big&&s.z>.9){cx.fillStyle=`rgba(${sb[0]},${sb[1]},${sb[2]},${a})`;cx.beginPath();cx.arc(s.x,s.y,1.8,0,7);cx.fill();
      cx.fillStyle=`rgba(${sb[0]},${sb[1]},${sb[2]},${a*.22})`;cx.beginPath();cx.arc(s.x,s.y,5,0,7);cx.fill();}
    else{cx.fillStyle=`rgba(${sb[0]},${sb[1]},${sb[2]},${a*(.35+s.z*.5)})`;cx.fillRect(s.x|0,s.y|0,s.z>.9?2:1,s.z>.9?2:1);}}
  cx.strokeStyle=`rgba(${sb[0]},${sb[1]},${sb[2]},.5)`;
  for(const d of dust){cx.globalAlpha=d.a;cx.lineWidth=1;cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x,d.y+d.len);cx.stroke();}
  cx.globalAlpha=1;
  if(menu)drwGrid(.14);else drwGrid(.05);
  for(const a of asteroids){cx.save();cx.translate(a.x,a.y);cx.rotate(a.rot);const s=84*a.s;
    if(a.s<.62)cx.globalAlpha=.78;
    cx.drawImage(ASTS[a.vi],-s/2,-s/2,s,s);cx.globalAlpha=1;
    if(a.flash>0){cx.globalCompositeOperation='lighter';cx.globalAlpha=a.flash/9;cx.fillStyle='#fff';cx.beginPath();cx.arc(0,0,32*a.s,0,7);cx.fill();}
    cx.restore();}}
function drwGrid(alpha){gridY=(gridY+.5)%40;cx.save();cx.globalAlpha=alpha;cx.strokeStyle=ZONES[currentZone].gridCol;cx.lineWidth=1;
  for(let i=0;i<15;i++){const y=GH-180+i*40+gridY;if(y>GH-160){cx.beginPath();cx.moveTo(0,y);cx.lineTo(GW,y);cx.stroke();}}
  for(let i=-5;i<=5;i++){cx.beginPath();cx.moveTo(GW/2,GH-160);cx.lineTo(GW/2+i*100,GH);cx.stroke();}
  cx.globalAlpha=Math.min(1,alpha*3);cx.lineWidth=2;cx.shadowColor=ZONES[currentZone].gridCol;cx.shadowBlur=10;
  cx.beginPath();cx.moveTo(0,GH-160);cx.lineTo(GW,GH-160);cx.stroke();cx.shadowBlur=0;cx.restore();}

/* ================= PARTICLES ================= */
const parts=[],ftexts=[],medals=[];
function addP(o){if(parts.length<750)parts.push(o);}
function sparks(x,y,col,n,sp=4.2){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*sp;addP({kind:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.03+Math.random()*.045,col:Math.random()<.4?'#fff':col});}}
function fireP(x,y,r,n=1){for(let i=0;i<n;i++)addP({kind:'fire',x:x+(Math.random()-.5)*6,y:y+(Math.random()-.5)*6,vx:(Math.random()-.5)*.7,vy:(Math.random()-.5)*.7,r,life:1,dec:.05+Math.random()*.03});}
function smokeP(x,y,r,n=1){for(let i=0;i<n;i++)addP({kind:'smoke',x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,vx:(Math.random()-.5)*.4,vy:-.15-Math.random()*.25,r,life:1,dec:.011+Math.random()*.007});}
function debrisP(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*3.4;addP({kind:'debris',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,rv:(Math.random()-.5)*.3,rot:Math.random()*7,s:2+Math.random()*4,life:1,dec:.008,col});}}
function flashP(x,y,r){addP({kind:'flash',x,y,r,life:1,dec:.16});}
function ringP(x,y,R,col){addP({kind:'ring',x,y,R,col,life:1,dec:.045});}
function explode(x,y,scale,col){flashP(x,y,26*scale);if(scale>=1.3)ringP(x,y,46*scale,col);
  fireP(x,y,(9+Math.random()*8)*scale,Math.round(7*scale));smokeP(x,y,(9+Math.random()*7)*scale,Math.round(5*scale));
  sparks(x,y,col,Math.round(11*scale));debrisP(x,y,Math.round(4*scale),'#2a2a30');}
function ftext(x,y,txt,col,big){ftexts.push({x,y,txt,col,life:60,big});}
function updParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];
  p.x+=p.vx||0;p.y+=p.vy||0;
  if(p.kind==='spark'){p.vy+=.05;p.vx*=.97;p.vy*=.97;}
  if(p.kind==='debris'){p.vy+=.07;p.rot+=p.rv;}
  p.life-=p.dec;if(p.life<=0)parts.splice(i,1);}}
function drwParts(){for(const p of parts){const a=Math.max(0,Math.min(1,p.life));
  if(p.kind==='smoke'){cx.globalAlpha=a*.5;const s=p.r*(2.4-p.life*1.4)*2;cx.drawImage(SMOKE_SPR,p.x-s/2,p.y-s/2,s,s);continue;}
  cx.globalCompositeOperation='lighter';
  if(p.kind==='fire'){cx.globalAlpha=a;const s=p.r*(0.7+(1-p.life)*1.5)*2;cx.drawImage(FIRE_SPR,p.x-s/2,p.y-s/2,s,s);}
  else if(p.kind==='flash'){cx.globalAlpha=a;const s=p.r*(1.1+(1-p.life)*.6)*2;cx.drawImage(FLASH_SPR,p.x-s/2,p.y-s/2,s,s);}
  else if(p.kind==='spark'){cx.globalAlpha=a;cx.strokeStyle=p.col;cx.lineWidth=1.8*a;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);cx.stroke();}
  else if(p.kind==='ring'){cx.globalAlpha=a*.85;cx.strokeStyle=p.col;cx.lineWidth=3*a;cx.beginPath();cx.arc(p.x,p.y,(1-p.life)*p.R+4,0,7);cx.stroke();}
  else if(p.kind==='debris'){cx.globalCompositeOperation='source-over';cx.globalAlpha=Math.min(1,p.life*2);cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.col;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.7);cx.restore();}
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';}}
function updFtexts(){for(let i=ftexts.length-1;i>=0;i--){ftexts[i].y-=.8;if(--ftexts[i].life<=0)ftexts.splice(i,1);}}
function drwFtexts(){for(const f of ftexts){cx.globalAlpha=Math.min(1,f.life/25);cx.fillStyle=f.col;cx.font=(f.big?12:9)+'px "Press Start 2P"';cx.textAlign='center';cx.shadowColor=f.col;cx.shadowBlur=6;cx.fillText(f.txt,f.x,f.y);cx.shadowBlur=0;}cx.globalAlpha=1;}

/* ================= COMBO & MEDALS ================= */
let combo=1,comboTimer=0,maxCombo=1,kills=0;
function addCombo(){combo=Math.min(combo+1,16);maxCombo=Math.max(maxCombo,combo);comboTimer=120;snd('combo');}
function updCombo(){if(comboTimer>0)comboTimer--;else if(combo>1)combo=1;}
function drwCombo(){if(combo>1){const u=comboTimer/120;cx.save();cx.fillStyle='#ffff00';cx.font=(10+combo)+'px "Press Start 2P"';cx.textAlign='right';cx.shadowColor='#ffff00';cx.shadowBlur=10;cx.fillText('x'+combo,GW-10,66);cx.shadowBlur=0;
  cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(GW-70,72,60,3);cx.fillStyle='#ffff00';cx.fillRect(GW-70,72,60*u,3);cx.restore();}}
function spawnMedal(x,y){medals.push({x,y,vy:1.4,t:0});}
function updMedals(){for(let i=medals.length-1;i>=0;i--){const m=medals[i];m.y+=m.vy;m.t++;if(m.y>GH+20){medals.splice(i,1);continue;}
  const dx=m.x-pl.x,dy=m.y-pl.y,mr=60+upgrades.mag*45;
  if(pl.alive&&dx*dx+dy*dy<mr*mr){m.x+=(pl.x-m.x)*.1;m.y+=(pl.y-m.y)*.1;}
  if(pl.alive&&dx*dx+dy*dy<400){combo=Math.min(combo+3,16);maxCombo=Math.max(maxCombo,combo);comboTimer=120;snd('combo');ftext(pl.x,pl.y-20,'+3 COMBO','#ffff00');medals.splice(i,1);}}}
function drwMedals(){for(const m of medals){cx.save();cx.globalCompositeOperation='lighter';cx.shadowColor='#ffcc00';cx.shadowBlur=8;
  const sc=1+Math.sin(m.t*.2)*.15;cx.translate(m.x,m.y);cx.scale(sc,sc);

let shake=0;
function collisions(){
  for(let bi=pbul.length-1;bi>=0;bi--){const b=pbul[bi];let hit=false;
    for(const e of enemies){if(!e.alive)continue;const dx=b.x-e.x,dy=b.y-e.y,hr=e.type==='boss'?15:e.type==='tank'?14:12;
      if(dx*dx+dy*dy<hr*hr){pbul.splice(bi,1);e.hp--;e.flash=6;hit=true;
        if(e.hp<=0){e.alive=false;kills++;if(isBonusWave)bonusKilled++;addCombo();
          const pts=e.pts*(e.state==='dive'?2:1)*combo;score+=pts;
          const col=e.type==='boss'?'#33ff66':(e.type==='butt'||e.type==='tank')?'#ff3366':e.type==='split'?'#ff2df0':'#ffaa00';
          explode(e.x,e.y,e.type==='boss'?1.3:1,col);ftext(e.x,e.y-10,(combo>1?'x'+combo+' ':'')+pts,col);
          snd('hit');shake=Math.max(shake,e.type==='boss'?6:3);onEnemyDeath(e);}
        else{sparks(e.x,e.y,'#fff',5,3);snd('hit');}
        break;}}
    /* REALISM: your shots chip away at rocks — big ones take two hits */
    if(!hit){for(let ai=asteroids.length-1;ai>=0;ai--){const a=asteroids[ai];const dx=b.x-a.x,dy=b.y-a.y,rr=30*a.s;
      if(dx*dx+dy*dy<rr*rr){pbul.splice(bi,1);hit=true;a.flash=6;a.hp--;sparks(b.x,b.y,'#e0d0b8',5,3);snd('hit');
        if(a.hp<=0){score+=25;ftext(a.x,a.y-10,'25','#c9b8a0');explode(a.x,a.y,.7+a.s*.5,'#b0a08a');asteroids.splice(ai,1);asteroids.push(mkAst());shake=Math.max(shake,2);}
        break;}}}
    if(!hit&&boss&&boss.alive){const dx=b.x-boss.x,dy=b.y-boss.y;
      if(dx*dx+dy*dy<38*38){pbul.splice(bi,1);boss.hp--;boss.flash=4;
        sparks(b.x,b.y,'#fff',4,2.5);
        if(boss.hp<=0)killBoss();}}}
  if(bonus){for(let bi=pbul.length-1;bi>=0;bi--){const b=pbul[bi];const dx=b.x-bonus.x,dy=b.y-bonus.y;
    if(dx*dx+dy*dy<324){pbul.splice(bi,1);score+=bonus.pts;explode(bonus.x,bonus.y,1.3,'#ff44ff');
      ftext(bonus.x,bonus.y-10,bonus.pts+'','#ffaaff');snd('bonus');shake=5;bonus=null;break;}}}
  if(pl.alive&&pl.inv<=0){
    for(let i=ebul.length-1;i>=0;i--){const b=ebul[i];const dx=b.x-pl.x,dy=b.y-pl.y;
      if(dx*dx+dy*dy<100){ebul.splice(i,1);hitPl();break;}}
    for(const e of enemies){if(!e.alive)continue;const dx=e.x-pl.x,dy=e.y-pl.y;
      if(dx*dx+dy*dy<289){e.alive=false;if(isBonusWave)bonusKilled++;explode(e.x,e.y,1,'#ffaa00');if(e.carrier)onEnemyDeath(e);hitPl();break;}}
    if(boss&&boss.alive){const dx=boss.x-pl.x,dy=boss.y-pl.y;if(dx*dx+dy*dy<1764)hitPl();}
    /* REALISM: ramming a rock hurts — but ramming the carrier frees your fighter */
    for(let ai=asteroids.length-1;ai>=0;ai--){const a=asteroids[ai];const dx=a.x-pl.x,dy=a.y-pl.y,rr=30*a.s+9;
      if(dx*dx+dy*dy<rr*rr){explode(a.x,a.y,.9+a.s*.4,'#b0a08a');asteroids.splice(ai,1);asteroids.push(mkAst());hitPl();break;}}}}
function hitPl(){pl.hp--;dmgFlash=28;pl.hitFx=8;sparks(pl.x,pl.y,SHIP_DEFS[pl.shipType].col,14,4);shake=Math.max(shake,5);
  if(pl.hp<=0){pl.alive=false;lives--;pl.respawn=80;explode(pl.x,pl.y,1.7,SHIP_DEFS[pl.shipType].col);

  else{pl.inv=60;}}

<script>
/* ============ CMC PAGE SYNC — drill_attempts (same pipeline as WriteQuest / Word Forge) ============
   Fired by the two game-over sites above. Reads the signed-in session from localStorage
   (set by the React app at sign-in), refreshes an expired Firebase ID token via securetoken,
   and POSTs one drill_attempts doc with drillSource 'brain-lounge'.
   Not signed in → silent no-op: the game still works fully offline. Guests never post. */
var CMC_GALICA_SUBMIT=(function(){
  var BASE='https://firestore.googleapis.com/v1/projects/creative-minds-cambodia/databases/(default)/documents';
  var KEY='AIzaSyDNUq0ru99XKh08D887Xk63h36MPOlXWwc';
  function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function refresh(cb){
    var rt=ls('cmc-student-refresh-token');
    if(!rt){cb(null);return}
    fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)
    }).then(function(r){return r.ok?r.json():null}).then(function(d){
      if(d&&d.id_token){try{
        localStorage.setItem('cmc-student-token',d.id_token);
        localStorage.setItem('cmc-student-token-expires',String(Date.now()+(Number(d.expires_in)||3600)*1000-60000));
        if(d.refresh_token)localStorage.setItem('cmc-student-refresh-token',d.refresh_token);
      }catch(e){}cb(d.id_token)}else cb(null);
    }).catch(function(){cb(null)});
  }
  return function(score,hi){
    try{
      var name=ls('cmc-student-name'),tok=ls('cmc-student-token');
      if(!name||!tok)return;
      /* scorePct: every 100 points = 1% (capped at 100). correctCount carries the raw
         score so future boards/ticker can show it; totalCount stays 0 (rules allow ≥0). */
      var pct=Math.max(0,Math.min(100,Math.floor(score/100)));
      var go=function(t){
        if(!t)return;
        var classId=ls('cmc-student-classId');
        fetch(BASE+'/drill_attempts',{method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},
          body:JSON.stringify({fields:{
            drillSlug:{stringValue:'galica'},drillTitle:{stringValue:'Galica · Brain Lounge'},
            drillSource:{stringValue:'brain-lounge'},
            studentName:{stringValue:name},studentUid:{stringValue:ls('cmc-student-uid')||''},
            classId:classId?{stringValue:classId}:{nullValue:null},
            scorePct:{integerValue:String(pct)},
            correctCount:{integerValue:String(Math.max(0,Math.floor(score)))},
            totalCount:{integerValue:'0'},
            submittedAt:{timestampValue:new Date().toISOString()}
          }})
        }).catch(function(){});
      };
      var exp=Number(ls('cmc-student-token-expires')||'0');
      if(exp&&exp<=Date.now())refresh(go);else go(tok);
    }catch(e){}
  };
})();
</script>
