<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a08"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow-s" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg-s)"/>
  <rect width="400" height="200" fill="url(#glow-s)"/>
  <!-- Soundwave recording indicator -->
  <g opacity="0.40" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="22" y1="100" x2="22" y2="100"/>
    <line x1="38" y1="90" x2="38" y2="110"/>
    <line x1="54" y1="75" x2="54" y2="125"/>
    <line x1="70" y1="55" x2="70" y2="145"/>
    <line x1="86" y1="40" x2="86" y2="160"/>
    <line x1="102" y1="60" x2="102" y2="140"/>
    <line x1="118" y1="80" x2="118" y2="120"/>
    <line x1="134" y1="50" x2="134" y2="150"/>
    <line x1="150" y1="70" x2="150" y2="130"/>
    <line x1="166" y1="90" x2="166" y2="110"/>
    <line x1="182" y1="60" x2="182" y2="140"/>
    <line x1="198" y1="80" x2="198" y2="120"/>
  </g>
  <!-- Microphone silhouette bottom-right -->
  <g opacity="0.18" fill="#f59e0b" transform="translate(248,40)">
    <rect x="20" y="0" width="24" height="60" rx="12"/>
    <path d="M10,40 Q10,80 32,80 Q54,80 54,40" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <line x1="32" y1="80" x2="32" y2="100" stroke="#f59e0b" stroke-width="3"/>
    <line x1="20" y1="100" x2="44" y2="100" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Recording pulse -->
  <circle cx="32" cy="32" r="4" fill="#ef4444" opacity="0.5"/>
</svg>
