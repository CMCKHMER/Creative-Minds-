name: Daily Cambodia Education News Scrape

# Daily scrape of Cambodia education news headlines.
# Runs at 08:00 Phnom Penh local time (01:00 UTC), and can be triggered
# manually from the Actions tab any time. Writes the JSON to
# public/news/headlines.json and commits it to main so the static
# GitHub Pages site serves fresh headlines on the next build.

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Phnom_Penh (UTC+7)
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run the news scraper
        id: scrape
        run: |
          python3 scripts/news_scraper.py --indent --total-keep 15
          # Read back the generated file to surface a summary in the workflow log
          python3 - <<'PY'
          import json
          data = json.load(open('public/news/headlines.json'))
          print(f"Generated at: {data['generated_at']}")
          print(f"Headlines: {data['count']}")
          print()
          for i, h in enumerate(data['headlines'], 1):
              print(f"  {i:2d}. [{h['source']}] {h['title']}")
          PY

      - name: Commit and push the updated headlines
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet public/news/headlines.json; then
            echo "No changes to headlines — nothing to commit."
            exit 0
          fi

          git add public/news/headlines.json
          git commit -m "chore(news): daily Cambodia education news scrape

          Auto-generated by the news-scraper GitHub Action.

          Source: Google News RSS (Cambodia + education keywords)
          Headlines: $(python3 -c 'import json;print(json.load(open("public/news/headlines.json"))["count"])')
          Generated: $(python3 -c 'import json;print(json.load(open("public/news/headlines.json"))["generated_at"])')"

          git push
          echo "✓ Pushed updated headlines."
