name: Blogger feed sync (From the Blog)

# Mirrors the director's personal Blogger posts into the static homepage.
# Runs every 4 hours and can be triggered manually from the Actions tab.
# scripts/blog_sync.py fetches the Blogger feed server-side (no CORS or
# browser dependency), writes public/blog/posts.json, and commits it to
# main so the next Pages build serves fresh posts. The homepage section
# (BlogSection.tsx) loads the JSON at runtime — no app rebuild needed
# beyond this commit.

on:
  schedule:
    # Every 4 hours, offset from the news scraper to avoid overlap.
    - cron: '20 1,5,9,13,17,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync the Blogger feed
        run: |
          python3 scripts/blog_sync.py --indent
          # Surface the generated feed in the workflow log
          python3 - <<'PY'
          import json
          data = json.load(open('public/blog/posts.json'))
          print(f"Generated at: {data['generated_at']}")
          print(f"Posts: {data['count']}")
          for p in data['posts']:
              print(f"  - [{p['date_label']}] ({p['media']}) {p['title'][:60]}")
          PY

      - name: Commit and push the updated feed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet public/blog/posts.json; then
            echo "No changes to the blog feed — nothing to commit."
            exit 0
          fi

          git add public/blog/posts.json
          git commit -m "chore(blog): sync latest posts from Blogger

          Auto-generated by the blog-sync GitHub Action.

          Source: creativemindscambodia.blogspot.com Atom feed
          Posts: $(python3 -c 'import json;print(json.load(open("public/blog/posts.json"))["count"])')
          Generated: $(python3 -c 'import json;print(json.load(open("public/blog/posts.json"))["generated_at"])')"

          git push
          echo "✓ Pushed updated blog feed."
