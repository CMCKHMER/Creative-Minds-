name: Build & Deploy to GitHub Pages

# Besides deploying every push to main, this workflow rebuilds the site once
# a day so the generated feeds stay fresh: scripts/refresh_feeds.py re-runs
# the news scraper and the Blogger sync inside the build and the results go
# straight into the deployed artifact.
#
# This replaces the old news-scraper.yml / blog-sync.yml workflows. Those
# committed the regenerated JSON back to main, which the branch ruleset
# rejects for the Actions bot — every scheduled run failed and the news
# panel went stale. Nothing is pushed to the repository any more.

on:
  push:
    branches:
      - main
  schedule:
    # 01:00 UTC = 08:00 Asia/Phnom_Penh (UTC+7)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npx vitest run
      # Every Brain Lounge cartridge: the launch target, the account gate, the
      # score sync, the way back to CMC, and that every local image it points
      # at really exists (scripts/check_brain_lounge_games.mjs).
      - name: Brain Lounge cartridge audit
        run: npm run check:lounge
      # After the tests (which validate the committed data files) and before
      # the build. The script keeps the committed copy of any feed it cannot
      # regenerate and always exits 0, so a feed outage never blocks a deploy.
      # No pip cache: both generators are stdlib-only and there is no
      # requirements file for the cache to key on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh news headlines and blog feed
        run: python3 scripts/refresh_feeds.py
      - name: Build
        run: npm run build
        env:
          # Optional: switches on the Google Drive + Classroom client
          # (docs/google-classroom-drive.md). Unset → the app ships with every
          # Google feature off and needs no Google project at all.
          # Add it under Settings → Secrets and variables → Actions → Variables.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # One small preview page per announcement, so a post shared to Facebook,
      # Telegram or WhatsApp shows its own title and picture. Reads the public
      # announcements from the database; exits 0 when it cannot be reached.
      - name: Preview pages for shared announcements
        run: node scripts/build_share_pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
