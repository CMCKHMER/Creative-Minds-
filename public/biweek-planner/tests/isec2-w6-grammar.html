<script>

    {'id':'isec2-w6-list','title':'Grammar Questions (15 questions)'}
  ]
};
const BANKS = {
"isec2-w6-list":[
["It is imperative that the manuscript ____ submitted before the committee convenes, or the publication will be deferred indefinitely.",["be","is","will be","was being"],0],
["The archaeological team _______ unearthed the artifact sooner if they had deployed ground-penetrating radar at the onset of the excavation.",["should have","could have","must have","would have to"],1],
["_______ the monetary policy been adjusted preemptively, the hyperinflationary spiral of the late 1980s might have been averted.",["If","Should","Had","Were"],2],

<script>
// Each test page defines its config + banks before this script runs
// by setting window.TEST_CONFIG and window.TEST_BANKS

const config=window.TEST_CONFIG;
const banks=window.TEST_BANKS;

// Render header
document.getElementById('test-header').innerHTML=`
  <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full glass text-xs font-semibold mb-4" style="color:${config.color}">
    <i class="fas ${config.icon} text-xs"></i> ${config.kicker}
  </div>
  <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-white mb-3">${config.title}</h1>
  <p class="text-sm text-slate-400 max-w-2xl leading-relaxed mb-4">${config.instructions}</p>
  ${config.transcript?`<div class="glass rounded-lg p-4 mb-4 border-l-2" style="border-left-color:#5eead4"><h4 class="text-xs font-bold text-teal-300 mb-1">Transcript</h4><p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${config.transcript}</p></div>`:''}
`;

// Render form
const form=document.getElementById('test-form');
const fieldsHtml=config.fields.includes('id')?`
  <div class="grid gap-2 rounded-lg glass p-3 sm:grid-cols-3">
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Student Name</label><input id="t-name" required type="text" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm" placeholder="Enter your name"></div>
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Date</label><input id="t-date" required type="date" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm"></div>
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Student ID</label><input id="t-id" required type="text" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm" placeholder="Enter your ID"></div>
  </div>`:`
  <div class="grid gap-2 rounded-lg glass p-3 sm:grid-cols-2">
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Student Name</label><input id="t-name" required type="text" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm" placeholder="Enter your name"></div>
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Date</label><input id="t-date" required type="date" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm"></div>
  </div>`;

const groupsHtml=config.groups.map(g=>`
  <div class="mt-4">
    <h3 class="font-display text-sm font-bold text-white mb-1">${g.title}</h3>
    ${g.focus?`<p class="text-xs text-slate-500 mb-2">${g.focus}</p>`:''}
    ${g.dirs?`<p class="text-xs text-slate-500 mb-2">${g.dirs}</p>`:''}
    <div id="${g.id}" class="grid gap-2 lg:grid-cols-2"></div>
  </div>`).join('');

form.innerHTML=fieldsHtml+`
  <div class="mt-3 flex flex-wrap items-end gap-2 rounded-lg glass p-3">
    <div class="min-w-[120px] flex-1"><p class="progress-text font-bold text-xs text-slate-300" aria-live="polite">0 answered</p><div class="mt-1 h-1.5 overflow-hidden rounded-full bg-white/8"><div class="progress-bar h-full rounded-full transition-all" style="width:0%;background:linear-gradient(90deg,#38bdf8,#8b5cf6)"></div></div></div>
    <label class="flex flex-col gap-1 text-xs text-slate-400"><span>Minutes</span><input class="timer-minutes w-16 rounded-lg border border-white/10 bg-white/5 px-2 py-1.5 text-white" type="number" min="1" max="180" value="20"></label>

    <button class="timer-stop btn" type="button" disabled><i class="fas fa-stop text-xs"></i> Stop</button>

  </div>
  ${groupsHtml}
  <div class="mt-4 flex flex-wrap items-center gap-2 border-t border-white/8 pt-3">
    <button class="btn-primary btn" type="submit"><i class="fas fa-paper-plane text-xs"></i> Submit Answers</button>
    <p id="t-result" class="hidden w-full rounded-lg p-3 text-sm" role="status" aria-live="polite"></p>
  </div>`;

// Render questions
const counts={};
function addQ(target,number,prompt,choices,answer,kind='radio',values=null){
  const card=document.createElement('div');
  card.className='question-card';
  card.dataset.answer=Array.isArray(answer)?answer.map(String).sort().join('|'):String(answer);
  const optsHtml=choices.map((choice,i)=>{
    const input=document.createElement('input');
    input.type=kind;input.name=`${target.id}-q${number}`;input.value=String(values?values[i]:i);
    return `<label class="option"><input type="${kind}" name="${target.id}-q${number}" value="${values?values[i]:i}"><span class="option-letter text-xs">${kind==='checkbox'?'□':String.fromCharCode(65+i)+'.'}</span><span class="text-xs text-slate-300">${choice}</span></label>`;
  }).join('');
  card.innerHTML=`<p class="font-semibold text-sm text-slate-200 mb-2">${number}. ${prompt}</p><div class="grid gap-1.5">${optsHtml}</div>`;
  target.appendChild(card);
}

Object.entries(banks).forEach(([tid,rows])=>{
  const target=document.getElementById(tid);
  if(!target)return;
  rows.forEach((r,i)=>addQ(target,(counts[tid]=(counts[tid]||0)+1),r[0],r[1],r[2]));
});

// Handle special question types (rhetorical)
if(window.RHETORICAL_A){
  const rA=document.getElementById('rhetorical-a-list');
  if(rA)window.RHETORICAL_A.forEach((r,i)=>addQ(rA,i+1,r[0],["Error (1) · Reason","Error (1) · Explanation","Error (1) · Justification","Error (2) · Reason","Error (2) · Explanation","Error (2) · Justification","Error (3) · Reason","Error (3) · Explanation","Error (3) · Justification","Error (4) · Reason","Error (4) · Explanation","Error (4) · Justification"],`${r[1]}:${r[2]}`,'radio',Array.from({length:12},(_,j)=>`${Math.floor(j/3)+1}:${j%3}`)));
}
if(window.RHETORICAL_B){
  const rB=document.getElementById('rhetorical-b-list');
  if(rB)window.RHETORICAL_B.forEach((r,i)=>addQ(rB,(window.RHETORICAL_A?.length||0)+i+1,r[0],["1 = reason","2 = explanation","3 = justification","4 = cause-and-effect or purpose"],r[1],'checkbox',[1,2,3,4]));
}

// Timer + scoring
const cards=[...form.querySelectorAll('.question-card')];
const minutes=document.querySelector('.timer-minutes');
const progress=document.querySelector('.progress-text');
const bar=document.querySelector('.progress-bar');
const face=document.querySelector('.timer-face');
const startBtn=document.querySelector('.timer-start');
const stopBtn=document.querySelector('.timer-stop');
let remaining=1200,interval=null;
function renderTime(){face.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;face.classList.toggle('warning',remaining>0&&remaining<=60)}
minutes.addEventListener('change',()=>{if(!interval){minutes.value=String(Math.min(180,Math.max(1,Number(minutes.value)||20)));remaining=Number(minutes.value)*60;renderTime()}});
startBtn.addEventListener('click',()=>{clearInterval(interval);remaining=Math.min(180,Math.max(1,Number(minutes.value)||20))*60;renderTime();startBtn.disabled=true;stopBtn.disabled=false;interval=setInterval(()=>{remaining=Math.max(0,remaining-1);renderTime();if(!remaining){clearInterval(interval);interval=null;startBtn.disabled=false;stopBtn.disabled=true;face.classList.add('warning');face.textContent='TIME UP';try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=740;g.gain.setValueAtTime(.0001,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.14,ctx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d+.18);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.2)});setTimeout(()=>ctx.close(),1200)}catch(e){}}},1000)});
stopBtn.addEventListener('click',()=>{clearInterval(interval);interval=null;startBtn.disabled=false;stopBtn.disabled=true});
function updateProgress(){const ans=cards.filter(c=>c.querySelector('input:checked')).length;progress.textContent=`${ans} of ${cards.length} answered`;bar.style.width=`${Math.round(ans/cards.length*100)}%`}
form.addEventListener('change',updateProgress);updateProgress();
const result=document.getElementById('t-result');
const submit=form.querySelector('button[type="submit"]');
form.addEventListener('submit',e=>{
  e.preventDefault();if(submit.disabled)return;
  const name=document.getElementById('t-name'),date=document.getElementById('t-date'),sid=document.getElementById('t-id');
  const missing=[name,date,...(sid?[sid]:[])].find(f=>!f.value.trim());
  if(missing){result.textContent='Please fill in your name and date.';result.classList.remove('hidden');result.style.background='rgba(248,113,113,.1)';result.style.color='#f87171';missing.focus();return}
  const mc=cards.find(c=>!c.querySelector('input:checked'));
  if(mc){mc.classList.add('needs-answer');result.textContent='Answer every question before submitting. The first unanswered question is highlighted.';result.classList.remove('hidden');result.style.background='rgba(248,113,113,.1)';result.style.color='#f87171';mc.scrollIntoView({behavior:'smooth',block:'center'});return}
  const score=cards.filter(c=>[...c.querySelectorAll('input:checked')].map(i=>i.value).sort().join('|')===c.dataset.answer).length;
  cmcTrack('drill_complete',{drill_slug:window.location.pathname.split('/').pop(),drill_title:config.title,drill_source:'biweek-planner',score_pct:Math.round(score/cards.length*100),correct_count:score,total_count:cards.length});;try{var _stoken=localStorage.getItem('cmc-student-token');var _sname=localStorage.getItem('cmc-student-name')||'';if(_stoken&&_sname){var _url='https://firestore.googleapis.com/v1/projects/creative-minds-cambodia/databases/(default)/documents/drill_attempts';var _body={fields:{drillSlug:{stringValue:window.location.pathname.split('/').pop()},drillTitle:{stringValue:config.title},drillSource:{stringValue:'biweek-planner'},studentName:{stringValue:_sname},scorePct:{integerValue:String(Math.round(score/cards.length*100))},correctCount:{integerValue:String(score)},totalCount:{integerValue:String(cards.length)},submittedAt:{timestampValue:new Date().toISOString()}}};fetch(_url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_stoken},body:JSON.stringify(_body)}).catch(function(e){})}}catch(e){}result.textContent=`\u2713 Score: ${score}/${cards.length} (${Math.round(score/cards.length*100)}%) — ${config.title}`;
  result.classList.remove('hidden');result.style.background='rgba(16,185,129,.1)';result.style.color='#6ee7b7';
  submit.disabled=true;setTimeout(()=>submit.disabled=false,2000);
});
</script>

<!-- CMC SHARE BUTTON -->
<button id="cmc-share-btn" title="Share this page" aria-label="Share this page"><i class="fas fa-share-nodes"></i></button>
<div id="cmc-share-panel" role="menu" aria-label="Share options">
  <div class="share-title">Share this page</div>
  <a data-share="facebook" target="_blank" rel="noopener"><i class="fab fa-facebook" style="color:#1877f2"></i> Facebook</a>
  <a data-share="x" target="_blank" rel="noopener"><i class="fab fa-x-twitter" style="color:#e2e8f0"></i> X (Twitter)</a>
  <a data-share="whatsapp" target="_blank" rel="noopener"><i class="fab fa-whatsapp" style="color:#25d366"></i> WhatsApp</a>
  <a data-share="telegram" target="_blank" rel="noopener"><i class="fab fa-telegram" style="color:#229ed9"></i> Telegram</a>
  <a data-share="linkedin" target="_blank" rel="noopener"><i class="fab fa-linkedin" style="color:#0a66c2"></i> LinkedIn</a>
  <a data-share="email"><i class="fas fa-envelope" style="color:#f59e0b"></i> Email</a>
  <hr>
  <div class="share-copy" id="cmc-share-copy"><i class="fas fa-link" style="color:#67e8f9"></i> <span>Copy link</span></div>
</div>


<script>
(function(){
  var btn=document.getElementById('cmc-share-btn');
  var panel=document.getElementById('cmc-share-panel');
  if(!btn||!panel)return;
  btn.addEventListener('click',function(e){e.stopPropagation();panel.classList.toggle('open')});
  document.addEventListener('click',function(e){if(!panel.contains(e.target)&&e.target!==btn)panel.classList.remove('open')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')panel.classList.remove('open')});
  function buildURL(svc){
    var u=encodeURIComponent(window.location.href);
    var t=encodeURIComponent(document.title||'CMC Network practice page');
    if(svc==='facebook')return 'https://www.facebook.com/sharer/sharer.php?u='+u;
    if(svc==='x')return 'https://twitter.com/intent/tweet?url='+u+'&text='+t;
    if(svc==='whatsapp')return 'https://api.whatsapp.com/send?text='+t+'%20'+u;
    if(svc==='telegram')return 'https://t.me/share/url?url='+u+'&text='+t;
    if(svc==='linkedin')return 'https://www.linkedin.com/sharing/share-offsite/?url='+u;
    if(svc==='email')return 'mailto:?subject='+t+'&body='+u;
    return '#';
  }
  panel.querySelectorAll('a[data-share]').forEach(function(a){
    a.addEventListener('click',function(){
      var svc=a.getAttribute('data-share');
      if(svc==='email'){a.href=buildURL('email');return}
      a.href=buildURL(svc);cmcTrack('share_click',{service:svc});});
  });
  var copyBtn=document.getElementById('cmc-share-copy');
  if(copyBtn){
    copyBtn.addEventListener('click',function(){
      var label=copyBtn.querySelector('span');
      var done=function(){if(label){var orig=label.textContent;label.textContent='Copied!';setTimeout(function(){label.textContent=orig},1500)}};
      try{navigator.clipboard.writeText(window.location.href).then(done).catch(function(){done()});cmcTrack('share_click',{service:'copy_link'})}catch(e){done()}
    });
  }
})();
</script>
