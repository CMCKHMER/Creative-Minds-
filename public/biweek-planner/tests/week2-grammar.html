<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar: Conditionals & Agreement · TOEFL ITP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* DARK */
:root{--bg:#020617;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.10);--accent:#38bdf8;--text:#f1f5f9;--muted:#94a3b8;--shadow:rgba(0,0,0,.3)}
/* LIGHT */
html[data-theme="light"]{--bg:#f8fafc;--card:rgba(255,255,255,.85);--border:rgba(0,0,0,.10);--accent:#0284c7;--text:#1e293b;--muted:#64748b;--shadow:rgba(0,0,0,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 10% 10%,rgba(56,189,248,.10),transparent 50%),radial-gradient(ellipse 50% 40% at 90% 90%,rgba(139,92,246,.10),transparent 50%)}
.font-display{font-family:'Syne',sans-serif;letter-spacing:-0.02em}
.glass{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);text-decoration:none}
.btn:hover{background:rgba(56,189,248,.10);border-color:rgba(56,189,248,.4)}
.btn-primary{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#0f172a;border:none;font-weight:700}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.3)}
.btn-primary:disabled{opacity:.5;cursor:wait}
.question-card{padding:16px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.03);transition:all .2s}
.question-card.needs-answer{border-color:#f87171;background:rgba(248,113,113,.05)}
.option{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.02);cursor:pointer;line-height:1.4;transition:all .15s}
.option:hover{border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.04)}
.option:has(input:checked){border-color:var(--accent);background:rgba(56,189,248,.08)}
.option input{accent-color:var(--accent);margin-top:3px;flex:none}
.option-letter{font-weight:700;color:var(--accent);min-width:20px}
.timer-face{font-variant-numeric:tabular-nums}
.timer-face.warning{background:#f87171!important}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(56,189,248,.3),rgba(139,92,246,.3));border-radius:5px}
::selection{background:rgba(56,189,248,.3);color:#fff}

.theme-toggle{position:fixed;top:16px;right:110px;z-index:99995;width:40px;height:40px;border-radius:10px;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border:1px solid rgba(56,189,248,.3);color:#67e8f9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
html[data-theme="light"] .theme-toggle{background:rgba(255,255,255,.9);border-color:rgba(2,132,199,.2);color:#0284c7}
.theme-toggle:hover{transform:scale(1.1)}
html[data-theme="light"] .question-card{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.10)}
html[data-theme="light"] .option{border-color:rgba(0,0,0,.08);background:rgba(255,255,255,.5)}
html[data-theme="light"] .option:hover{border-color:rgba(2,132,199,.3);background:rgba(2,132,199,.04)}
html[data-theme="light"] .option:has(input:checked){border-color:var(--accent);background:rgba(2,132,199,.08)}
html[data-theme="light"] input{color:#1e293b}
html[data-theme="light"] input::placeholder{color:#94a3b8}
html[data-theme="light"] .btn-primary{color:#fff}

/* ===== COMPREHENSIVE LIGHT MODE OVERRIDES (biweek-planner) ===== */
html[data-theme="light"] h1.text-white,
html[data-theme="light"] h2.text-white,
html[data-theme="light"] h3.text-white,
html[data-theme="light"] h4.text-white,
html[data-theme="light"] p.text-white,
html[data-theme="light"] span.text-white,
html[data-theme="light"] button.text-white,
html[data-theme="light"] label.text-white,
html[data-theme="light"] .text-white{color:#1e293b!important}
html[data-theme="light"] .text-slate-100{color:#1e293b!important}
html[data-theme="light"] .text-slate-200{color:#334155!important}
html[data-theme="light"] .text-slate-300{color:#475569!important}
html[data-theme="light"] .text-slate-400{color:#64748b!important}
html[data-theme="light"] .text-slate-500{color:#94a3b8!important}
html[data-theme="light"] .text-slate-600{color:#a8b3c2!important}
html[data-theme="light"] .text-cyan-50{color:#0c4a6e!important}
html[data-theme="light"] .text-cyan-100{color:#0369a1!important}
html[data-theme="light"] .text-cyan-200{color:#0e7490!important}
html[data-theme="light"] .text-cyan-300{color:#0891b2!important}
html[data-theme="light"] .text-cyan-400{color:#0284c7!important}
html[data-theme="light"] .text-violet-100{color:#5b21b6!important}
html[data-theme="light"] .text-violet-200{color:#6d28d9!important}
html[data-theme="light"] .text-violet-300{color:#7c3aed!important}
html[data-theme="light"] .text-emerald-100{color:#047857!important}
html[data-theme="light"] .text-rose-100{color:#9f1239!important}
html[data-theme="light"] .text-rose-400{color:#e11d48!important}
html[data-theme="light"] .text-amber-100{color:#92400e!important}
html[data-theme="light"] .text-amber-400{color:#b45309!important}
html[data-theme="light"] .text-teal-300{color:#0d9488!important}

html[data-theme="light"] .bg-white\/5,
html[data-theme="light"] .bg-white\/8,
html[data-theme="light"] .bg-white\/10,
html[data-theme="light"] .bg-white\/6,
html[data-theme="light"] .bg-white\/3,
html[data-theme="light"] .bg-white\/2{background-color:rgba(0,0,0,.04)!important}
html[data-theme="light"] .border-white\/7,
html[data-theme="light"] .border-white\/8,
html[data-theme="light"] .border-white\/10{border-color:rgba(0,0,0,.10)!important}

html[data-theme="light"] input.text-white,
html[data-theme="light"] input[type="text"].text-white,
html[data-theme="light"] input[type="date"].text-white,
html[data-theme="light"] input[type="number"].text-white{color:#1e293b!important;background-color:#fff!important;border-color:rgba(0,0,0,.12)!important}
html[data-theme="light"] input.text-white::placeholder{color:#94a3b8!important}

html[data-theme="light"] .timer-face{background:#fff!important;border-color:rgba(0,0,0,.10)!important;color:#1e293b!important}
html[data-theme="light"] .timer-face.warning{background:#f87171!important;color:#fff!important}

/* top-nav buttons (Back to Planner, CMC) — override inline dark bg */
html[data-theme="light"] .btn[style*="rgba(15,23,42"],
html[data-theme="light"] a[style*="rgba(15,23,42"],
html[data-theme="light"] a[style*="background:rgba(15,23,42"]{background:rgba(255,255,255,.9)!important;border-color:rgba(2,132,199,.2)!important;color:#0284c7!important;backdrop-filter:blur(8px)}
html[data-theme="light"] a[style*="color:#67e8f9"]{color:#0284c7!important}

/* kicker pills with inline color (text-cyan-300, text-teal-300) on test pages */
html[data-theme="light"] .inline-flex[style*="color:"]{background:rgba(2,132,199,.08)!important}

/* week cards on dashboard */
html[data-theme="light"] .week-card{background:rgba(255,255,255,.85)!important;border-color:rgba(0,0,0,.10)!important;box-shadow:0 4px 16px rgba(0,0,0,.04)}
html[data-theme="light"] .week-card:hover{box-shadow:0 12px 32px rgba(0,0,0,.10);border-color:rgba(2,132,199,.4)!important}
html[data-theme="light"] .filter-btn{color:#64748b;background:transparent;border-color:rgba(0,0,0,.10)}
html[data-theme="light"] .filter-btn:hover{color:#1e293b;border-color:rgba(2,132,199,.3)}
html[data-theme="light"] .filter-btn.active{background:#0284c7;color:#fff;border-color:#0284c7}

/* transcript block */
html[data-theme="light"] .glass[style*="border-left-color:#5eead4"] h4{color:#0d9488!important}
html[data-theme="light"] .glass[style*="border-left-color:#5eead4"] p{color:#475569!important}

/* glass cards */
html[data-theme="light"] .glass{background:rgba(255,255,255,.85)!important;border-color:rgba(0,0,0,.10)!important;color:#1e293b}
html[data-theme="light"] .glass *{color:inherit}
html[data-theme="light"] .glass h1,
html[data-theme="light"] .glass h2,
html[data-theme="light"] .glass h3,
html[data-theme="light"] .glass h4{color:#1e293b}

/* selection */
html[data-theme="light"] ::selection{background:rgba(2,132,199,.25);color:#fff}

/* body bg already set by :root, but re-emphasize */
html[data-theme="light"] body{color:#1e293b}


/* AI-generated test page background */
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:url('img/test-bg.png');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:.12;mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 30%,black 0%,transparent 80%);
  mask-image:radial-gradient(ellipse 60% 50% at 50% 30%,black 0%,transparent 80%)}
html[data-theme="light"] body::after{opacity:.06;mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 30%,black 0%,transparent 85%);
  mask-image:radial-gradient(ellipse 60% 50% at 50% 30%,black 0%,transparent 85%)}


/* CMC SHARE BUTTON */
#cmc-share-btn{position:fixed;left:16px;bottom:16px;z-index:99994;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:17px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;border:1px solid rgba(255,255,255,.18)}
#cmc-share-btn:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 12px 30px rgba(56,189,248,.4)}
#cmc-share-panel{position:fixed;left:16px;bottom:70px;z-index:99994;min-width:240px;padding:10px;border-radius:14px;background:rgba(15,23,42,.96);backdrop-filter:blur(16px);border:1px solid rgba(56,189,248,.25);box-shadow:0 12px 40px rgba(0,0,0,.5);color:#f1f5f9;font-family:'Plus Jakarta Sans',sans-serif;display:none}
#cmc-share-panel.open{display:block;animation:cmcShareIn .18s ease-out}
@keyframes cmcShareIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#cmc-share-panel .share-title{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#67e8f9;padding:4px 8px 8px}
#cmc-share-panel a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:12px;font-weight:600;color:#e2e8f0;text-decoration:none;transition:all .15s}
#cmc-share-panel a:hover{background:rgba(56,189,248,.10);color:#fff}
#cmc-share-panel a i{width:18px;text-align:center;font-size:14px}
#cmc-share-panel .share-copy{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:12px;font-weight:600;color:#e2e8f0;cursor:pointer;transition:all .15s}
#cmc-share-panel .share-copy:hover{background:rgba(56,189,248,.10);color:#fff}
#cmc-share-panel .share-copy i{width:18px;text-align:center;font-size:14px}
#cmc-share-panel hr{border:none;border-top:1px solid rgba(255,255,255,.10);margin:6px 0}
html[data-theme="light"] #cmc-share-panel{background:rgba(255,255,255,.96);border-color:rgba(2,132,199,.2);color:#1e293b;box-shadow:0 12px 40px rgba(0,0,0,.15)}
html[data-theme="light"] #cmc-share-panel .share-title{color:#0284c7}
html[data-theme="light"] #cmc-share-panel a{color:#334155}
html[data-theme="light"] #cmc-share-panel a:hover{background:rgba(2,132,199,.08);color:#0c4a6e}
html[data-theme="light"] #cmc-share-panel .share-copy{color:#334155}
html[data-theme="light"] #cmc-share-panel .share-copy:hover{background:rgba(2,132,199,.08);color:#0c4a6e}
html[data-theme="light"] #cmc-share-panel hr{border-top-color:rgba(0,0,0,.10)}

/* CMC-TEMPLATE-V2 */
.qmap{position:sticky;top:70px;z-index:30;display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;margin-bottom:16px;border-radius:12px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(10px);max-height:60px;overflow-x:auto;overflow-y:hidden}
.qmap-item{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);transition:all .15s;flex-shrink:0}
.qmap-item:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
.qmap-item.answered{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:#34d399}
.qmap-item.flagged{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4);color:#fbbf24}
.qmap-item.correct{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.5);color:#34d399}
.qmap-item.wrong{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.4);color:#f87171}
.flag-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;opacity:.4;border:1px solid transparent;background:transparent;color:var(--muted);transition:all .15s}
.flag-btn:hover{opacity:1;border-color:rgba(251,191,36,.3);color:#fbbf24}
.question-card{position:relative}
.question-card.flagged{border-color:rgba(251,191,36,.3)}
.sticky-timer-bar{position:sticky;top:0;z-index:35;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;margin:-10px -16px 16px;border-bottom:1px solid var(--border);background:var(--card);backdrop-filter:blur(12px)}
.timer-face.warning{background:rgba(251,191,36,.15)!important;border-color:rgba(251,191,36,.5)!important;color:#fbbf24!important}
.timer-face.danger{background:rgba(248,113,113,.15)!important;border-color:rgba(248,113,113,.5)!important;color:#f87171!important;animation:tp 1s ease-in-out infinite}
@keyframes tp{0%,100%{opacity:1}50%{opacity:.6}}
.review-modal{position:fixed;inset:0;z-index:99998;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.review-modal.open{display:flex}
.review-modal-card{max-width:480px;width:calc(100% - 32px);border-radius:16px;border:1px solid var(--border);background:var(--bg);padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.review-stat{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:0 12px}
.review-stat b{font-size:28px;font-weight:800;color:var(--text)}
.review-stat span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.review-stat.unanswered b{color:#f87171}
.review-stat.flagged b{color:#fbbf24}
.review-stat.answered b{color:#34d399}
.q-explanation{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(56,189,248,.04);font-size:12px;line-height:1.6;color:var(--muted)}
.q-explanation.show{display:block}
.q-explanation b{color:var(--text)}
.question-card.correct-answer{border-color:rgba(16,185,129,.3)}
.question-card.wrong-answer{border-color:rgba(248,113,113,.3)}
.option.correct-opt{border-color:rgba(16,185,129,.5)!important;background:rgba(16,185,129,.08)!important}
.option.wrong-opt{border-color:rgba(248,113,113,.4)!important;background:rgba(248,113,113,.06)!important}
.skill-breakdown{display:none;margin-top:12px;padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.skill-breakdown.show{display:block}
.skill-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.skill-bar-row .skill-name{width:80px;font-size:11px;font-weight:600;color:var(--muted);text-align:right}
.skill-bar-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.skill-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.skill-bar-row .skill-score{width:48px;font-size:11px;font-weight:700;color:var(--text)}
html[data-theme="light"] .qmap{background:rgba(255,255,255,.6)}
html[data-theme="light"] .qmap-item{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
html[data-theme="light"] .sticky-timer-bar{background:rgba(255,255,255,.7)}
html[data-theme="light"] .review-modal-card{background:#fff}
html[data-theme="light"] .skill-breakdown{background:rgba(255,255,255,.5)}
html[data-theme="light"] .q-explanation{background:rgba(2,132,199,.04);border-color:rgba(0,0,0,.08)}
</style>

<script id="cmc-role-gate">
/* CMC role indicator — shows Teacher mode / Student mode badge */
(function(){
  try { window.CMC_IS_TEACHER = localStorage.getItem('cmc-student-role') === 'teacher'; }
  catch(e) { window.CMC_IS_TEACHER = false; }
  document.addEventListener('DOMContentLoaded', function(){
    var b = document.createElement('div');
    if (window.CMC_IS_TEACHER) {
      b.textContent = '🎓 Teacher mode';
      b.style.cssText = 'position:fixed;top:62px;right:16px;z-index:99994;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(52,211,153,0.12);color:#6ee7b7;border:1px solid rgba(52,211,153,0.35);backdrop-filter:blur(8px);font-family:Inter,sans-serif;letter-spacing:0.02em;';
    } else {
      b.textContent = 'Student mode';
      b.style.cssText = 'position:fixed;top:62px;right:16px;z-index:99994;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(34,211,238,0.10);color:#67e8f9;border:1px solid rgba(34,211,238,0.30);backdrop-filter:blur(8px);font-family:Inter,sans-serif;letter-spacing:0.02em;';
    }
    document.body.appendChild(b);
  });
})();
</script>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle light/dark"><i class="fas fa-sun"></i></button>
<script>
function toggleTheme(){var h=document.documentElement;var dark=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('biweek-theme',dark?'light':'dark')}catch(e){}document.getElementById('themeToggle').innerHTML=dark?'<i class="fas fa-moon"></i>':'<i class="fas fa-sun"></i>';cmcTrack('theme_toggle',{theme:dark?'light':'dark'})}
try{var saved=localStorage.getItem('biweek-theme');if(saved){document.documentElement.setAttribute('data-theme',saved);window.addEventListener('DOMContentLoaded',function(){document.getElementById('themeToggle').innerHTML=saved==='light'?'<i class="fas fa-moon"></i>':'<i class="fas fa-sun"></i>'})}}catch(e){}
</script>

<div class="relative z-10 max-w-4xl mx-auto px-4 py-10 sm:px-6">
  <div id="test-header"></div>
  <div id="qmap" class="qmap"></div>
  <form id="test-form" novalidate></form>
  <div id="review-modal" class="review-modal"><div class="review-modal-card"><h3 class="font-display text-xl font-bold mb-3" style="color:var(--text)">Ready to submit?</h3><div class="flex justify-center mb-4"><div class="review-stat answered"><b id="rv-answered">0</b><span>Answered</span></div><div class="review-stat unanswered"><b id="rv-unanswered">0</b><span>Unanswered</span></div><div class="review-stat flagged"><b id="rv-flagged">0</b><span>Flagged</span></div></div><p class="text-xs mb-5" style="color:var(--muted)" id="rv-msg">Unanswered questions will count as incorrect.</p><div class="flex justify-center gap-2"><button class="btn" type="button" id="rv-review">Review answers</button><button class="btn-primary btn" type="button" id="rv-submit">Submit now</button></div></div></div>
</div>

<script>
window.TEST_CONFIG={
  title:'Grammar: Conditionals & Agreement',
  kicker:'Week 2 · Level 10 · Structure',
  color:'#f87171',
  icon:'fa-spell-check',
  instructions:'World Class Unit 11-12: Grammar. Choose the answer that correctly completes each sentence. Part I: Real and Unreal Conditionals. Part II: Subject-Verb Agreement.',
  fields:['name', 'date'],
  transcript:'',
  groups:[
    {'id':'w2-grammar-list','title':'Conditionals & Agreement (15 questions)'}
  ]
};
const BANKS = {
"w2-grammar-list":[
["If researchers ________ more reliable genetic evidence, they ________ able to determine whether the gene actually contributes to longevity.",["obtained / would be","had obtained / would have been","obtained / will be","would obtain / will be"],0],
["If the researchers ________ the same genetic pattern in a larger population, their findings ________ stronger evidence for a connection between genetics and healthy aging.",["had identified / will provide","will identify / would provide","identify / would provide","identify / will provide"],3],
["If environmental conditions ________ to improve, scientists ________ better able to distinguish genetic influences from lifestyle factors.",["had continued / would have been","will continue / would be","continue / will be","continues / will be"],2],
["If the Laron population ________ in a more diverse community now, researchers ________ greater difficulty determining whether their unusual health characteristics are caused by a single gene.",["lived / would have","had lived / will have","lives / will have","will live / would have"],0],
["If scientists ________ that genes account for most differences in lifespan, their understanding of the role of lifestyle ________ considerably.",["had proved / will change","proved / would change","will prove / would change","proves / will change"],1],
["If the study ________ a significant relationship between the gene and resistance to disease, the researchers ________ additional experiments to confirm the result.",["had revealed / will conduct","will reveal / would conduct","reveals / will conduct","revealed / will conduct"],2],
["Neither the quality of the materials nor the skills of the workers ________ responsible for the unexpected increase in production costs.",["appears to be","appear to be","have appeared to be","are appearing to be"],1],
["The committee of experts who ________ responsible for evaluating the proposals ________ expected to announce its decision tomorrow.",["is / are","are / is","is / is","are / are"],1],
["One of the most challenging aspects of learning a foreign language ________ understanding expressions that cannot be translated literally.",["are","have been","were","is"],3],
["The number of applicants for the scholarship ________ increased considerably this year, although the number of available scholarships ________ unchanged.",["have / remain","has / remains","has / remain","have / remains"],1],
["What the researchers discovered during the experiment ________ several unexpected problems that had not been considered during the planning stage.",["were","have been","are","was"],3]
]};
window.TEST_BANKS = BANKS;
</script>
<script>
// CMC-TEMPLATE-V2 — Each test page defines config + banks before this script runs

const config=window.TEST_CONFIG;
const banks=window.TEST_BANKS;

// Render header
document.getElementById('test-header').innerHTML=`
  <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full glass text-xs font-semibold mb-4" style="color:${config.color}">
    <i class="fas ${config.icon} text-xs"></i> ${config.kicker}
  </div>
  <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-white mb-3">${config.title}</h1>
  <p class="text-sm text-slate-400 max-w-2xl leading-relaxed mb-4">${config.instructions}</p>
  ${config.transcript?`<div class="glass rounded-lg p-4 mb-4 border-l-2" style="border-left-color:#5eead4"><h4 class="text-xs font-bold text-teal-300 mb-1">Transcript</h4><p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${config.transcript}</p></div>`:''}
`;

// Render form
const form=document.getElementById('test-form');
const fieldsHtml=config.fields.includes('id')?`
  <div class="grid gap-2 rounded-lg glass p-3 sm:grid-cols-3">
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Student Name</label><input id="t-name" required type="text" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm" placeholder="Enter your name"></div>
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Date</label><input id="t-date" required type="date" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm"></div>
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Student ID</label><input id="t-id" required type="text" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm" placeholder="Enter your ID"></div>
  </div>`:`
  <div class="grid gap-2 rounded-lg glass p-3 sm:grid-cols-2">
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Student Name</label><input id="t-name" required type="text" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm" placeholder="Enter your name"></div>
    <div><label class="text-xs text-slate-400 mb-1 block font-semibold">Date</label><input id="t-date" required type="date" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white text-sm"></div>
  </div>`;

const groupsHtml=config.groups.map(g=>`
  <div class="mt-4">
    <h3 class="font-display text-sm font-bold text-white mb-1">${g.title}</h3>
    ${g.focus?`<p class="text-xs text-slate-500 mb-2">${g.focus}</p>`:''}
    ${g.dirs?`<p class="text-xs text-slate-500 mb-2">${g.dirs}</p>`:''}
    <div id="${g.id}" class="grid gap-2 lg:grid-cols-2"></div>
  </div>`).join('');

// Sticky timer bar + progress
const timerBarHtml=`
  <div class="sticky-timer-bar">
    <span class="text-xs font-semibold" style="color:var(--muted)">Time:</span>
    <span class="timer-face rounded-lg px-3 py-1.5 font-bold text-white text-sm" style="background:rgba(15,23,42,.85);border:1px solid rgba(56,189,248,.2)" role="timer">20:00</span>
    <label class="flex items-center gap-1 text-xs" style="color:var(--muted)"><span>min</span><input class="timer-minutes w-14 rounded-lg border border-white/10 bg-white/5 px-2 py-1 text-white" type="number" min="1" max="180" value="20"></label>
    <button class="timer-start btn" type="button"><i class="fas fa-play text-xs"></i></button>
    <button class="timer-stop btn" type="button" disabled><i class="fas fa-stop text-xs"></i></button>
    <div class="min-w-[100px] flex-1 ml-3"><p class="progress-text font-bold text-xs text-slate-300" aria-live="polite">0 answered</p><div class="mt-1 h-1.5 overflow-hidden rounded-full bg-white/8"><div class="progress-bar h-full rounded-full transition-all" style="width:0%;background:linear-gradient(90deg,#38bdf8,#8b5cf6)"></div></div></div>
  </div>`;

form.innerHTML=fieldsHtml+timerBarHtml+`
  ${groupsHtml}
  <div class="mt-4 flex flex-wrap items-center gap-2 border-t border-white/8 pt-3">
    <button class="btn-primary btn" type="submit" id="submit-btn"><i class="fas fa-paper-plane text-xs"></i> Submit Answers</button>
    <p id="t-result" class="hidden w-full rounded-lg p-3 text-sm" role="status" aria-live="polite"></p>
    <div id="skill-breakdown" class="skill-breakdown w-full"></div>
  </div>`;

// Render questions with flag buttons
const counts={};
let qCounter=0;
const allQuestions=[];
function addQ(target,number,prompt,choices,answer,kind='radio',values=null){
  const card=document.createElement('div');
  card.className='question-card';
  card.dataset.answer=Array.isArray(answer)?answer.map(String).sort().join('|'):String(answer);
  card.dataset.qnum=String(++qCounter);
  const optsHtml=choices.map((choice,i)=>{
    return `<label class="option"><input type="${kind}" name="${target.id}-q${number}" value="${values?values[i]:i}"><span class="option-letter text-xs">${kind==='checkbox'?'\u25A1':String.fromCharCode(65+i)+'.'}</span><span class="text-xs text-slate-300">${choice}</span></label>`;
  }).join('');
  card.innerHTML=`<button class="flag-btn" type="button" title="Flag for review"><i class="far fa-flag"></i></button><p class="font-semibold text-sm text-slate-200 mb-2 pr-7">${number}. ${prompt}</p><div class="grid gap-1.5">${optsHtml}</div><div class="q-explanation"></div>`;
  target.appendChild(card);
  allQuestions.push(card);
  const flagBtn=card.querySelector('.flag-btn');
  flagBtn.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();card.classList.toggle('flagged');flagBtn.innerHTML=card.classList.contains('flagged')?'<i class="fas fa-flag" style="color:#fbbf24"></i>':'<i class="far fa-flag"></i>';updateQMap();});
}

Object.entries(banks).forEach(([tid,rows])=>{
  const target=document.getElementById(tid);
  if(!target)return;
  rows.forEach((r,i)=>addQ(target,(counts[tid]=(counts[tid]||0)+1),r[0],r[1],r[2]));
});

if(window.RHETORICAL_A){
  const rA=document.getElementById('rhetorical-a-list');
  if(rA)window.RHETORICAL_A.forEach((r,i)=>addQ(rA,i+1,r[0],["Error (1) \u00b7 Reason","Error (1) \u00b7 Explanation","Error (1) \u00b7 Justification","Error (2) \u00b7 Reason","Error (2) \u00b7 Explanation","Error (2) \u00b7 Justification","Error (3) \u00b7 Reason","Error (3) \u00b7 Explanation","Error (3) \u00b7 Justification","Error (4) \u00b7 Reason","Error (4) \u00b7 Explanation","Error (4) \u00b7 Justification"],`${r[1]}:${r[2]}`,'radio',Array.from({length:12},(_,j)=>`${Math.floor(j/3)+1}:${j%3}`)));
}
if(window.RHETORICAL_B){
  const rB=document.getElementById('rhetorical-b-list');
  if(rB)window.RHETORICAL_B.forEach((r,i)=>addQ(rB,(window.RHETORICAL_A?.length||0)+i+1,r[0],["1 = reason","2 = explanation","3 = justification","4 = cause-and-effect or purpose"],r[1],'checkbox',[1,2,3,4]));
}

// Build question map
const qmap=document.getElementById('qmap');
function buildQMap(){
  qmap.innerHTML='';
  allQuestions.forEach((card,i)=>{
    const item=document.createElement('button');
    item.type='button';item.className='qmap-item';item.textContent=String(i+1);
    item.title='Go to question '+(i+1);
    item.addEventListener('click',()=>{card.scrollIntoView({behavior:'smooth',block:'center'});card.style.transition='box-shadow .3s';card.style.boxShadow='0 0 0 2px var(--accent)';setTimeout(()=>{card.style.boxShadow=''},800);});
    qmap.appendChild(item);
  });
}
function updateQMap(){
  const items=qmap.querySelectorAll('.qmap-item');
  allQuestions.forEach((card,i)=>{
    if(!items[i])return;
    const answered=!!card.querySelector('input:checked');
    const flagged=card.classList.contains('flagged');
    items[i].className='qmap-item'+(answered?' answered':'')+(flagged?' flagged':'');
  });
}
buildQMap();

// Timer + scoring
const cards=allQuestions;
const minutes=document.querySelector('.timer-minutes');
const progressEl=document.querySelector('.progress-text');
const bar=document.querySelector('.progress-bar');
const face=document.querySelector('.timer-face');
const startBtn=document.querySelector('.timer-start');
const stopBtn=document.querySelector('.timer-stop');
let remaining=1200,interval=null;
function renderTime(){
  face.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
  face.classList.remove('warning','danger');
  if(remaining>0&&remaining<=120)face.classList.add('warning');
  if(remaining>0&&remaining<=30)face.classList.replace('warning','danger');
  if(remaining===0)face.classList.add('danger');
}
minutes.addEventListener('change',()=>{if(!interval){minutes.value=String(Math.min(180,Math.max(1,Number(minutes.value)||20)));remaining=Number(minutes.value)*60;renderTime()}});
startBtn.addEventListener('click',()=>{clearInterval(interval);remaining=Math.min(180,Math.max(1,Number(minutes.value)||20))*60;renderTime();startBtn.disabled=true;stopBtn.disabled=false;interval=setInterval(()=>{remaining=Math.max(0,remaining-1);renderTime();if(!remaining){clearInterval(interval);interval=null;startBtn.disabled=false;stopBtn.disabled=true;face.textContent='TIME UP';try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=740;g.gain.setValueAtTime(.0001,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.14,ctx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d+.18);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.2)});setTimeout(()=>ctx.close(),1200)}catch(e){}}},1000)});
stopBtn.addEventListener('click',()=>{clearInterval(interval);interval=null;startBtn.disabled=false;stopBtn.disabled=true});
function updateProgress(){const ans=cards.filter(c=>c.querySelector('input:checked')).length;progressEl.textContent=`${ans} of ${cards.length} answered`;bar.style.width=`${Math.round(ans/cards.length*100)}%`;updateQMap();}
form.addEventListener('change',updateProgress);updateProgress();
const result=document.getElementById('t-result');
const submitBtn=document.getElementById('submit-btn');
const reviewModal=document.getElementById('review-modal');
const rvAnswered=document.getElementById('rv-answered');
const rvUnanswered=document.getElementById('rv-unanswered');
const rvFlagged=document.getElementById('rv-flagged');
const rvMsg=document.getElementById('rv-msg');
const rvReview=document.getElementById('rv-review');
const rvSubmit=document.getElementById('rv-submit');

form.addEventListener('submit',e=>{
  e.preventDefault();if(submitBtn.disabled)return;
  const name=document.getElementById('t-name'),date=document.getElementById('t-date'),sid=document.getElementById('t-id');
  const missing=[name,date,...(sid?[sid]:[])].find(f=>!f.value.trim());
  if(missing){result.textContent='Please fill in your name and date.';result.classList.remove('hidden');result.style.background='rgba(248,113,113,.1)';result.style.color='#f87171';missing.focus();return}
  const answered=cards.filter(c=>c.querySelector('input:checked')).length;
  const unansweredCount=cards.length-answered;
  const flaggedCount=cards.filter(c=>c.classList.contains('flagged')).length;
  rvAnswered.textContent=answered;rvUnanswered.textContent=unansweredCount;rvFlagged.textContent=flaggedCount;
  if(unansweredCount>0){rvMsg.textContent=unansweredCount+' unanswered question'+(unansweredCount===1?'':'s')+' will count as incorrect. Review before submitting.';rvMsg.style.color='#f87171';}
  else if(flaggedCount>0){rvMsg.textContent='All answered. '+flaggedCount+' flagged to review.';rvMsg.style.color='#fbbf24';}
  else{rvMsg.textContent='All answered, none flagged. Ready to submit!';rvMsg.style.color='#34d399';}
  reviewModal.classList.add('open');
});
rvReview.addEventListener('click',()=>{reviewModal.classList.remove('open');const fu=cards.find(c=>!c.querySelector('input:checked'))||cards.find(c=>c.classList.contains('flagged'));if(fu)fu.scrollIntoView({behavior:'smooth',block:'center'});});
rvSubmit.addEventListener('click',()=>{reviewModal.classList.remove('open');doSubmit();});

function doSubmit(){
  const score=cards.filter(c=>[...c.querySelectorAll('input:checked')].map(i=>i.value).sort().join('|')===c.dataset.answer).length;
  cards.forEach((card,i)=>{
    const userAnswer=[...card.querySelectorAll('input:checked')].map(i=>i.value).sort().join('|');
    const correct=userAnswer===card.dataset.answer;
    card.classList.add(correct?'correct-answer':'wrong-answer');
    card.querySelectorAll('.option').forEach(opt=>{const inp=opt.querySelector('input');if(!inp)return;const cv=card.dataset.answer.split('|');if(cv.includes(inp.value))opt.classList.add('correct-opt');else if(inp.checked)opt.classList.add('wrong-opt');});
    const exp=card.querySelector('.q-explanation');if(exp){exp.classList.add('show');exp.innerHTML=correct?'<b>\u2705 Correct!</b>':`<b>\u274C Incorrect.</b> The correct answer is highlighted in green.`;}
    const item=qmap.querySelectorAll('.qmap-item')[i];if(item)item.className='qmap-item '+(correct?'correct':'wrong');
  });
  // Skill breakdown
  const breakdown=document.getElementById('skill-breakdown');
  const gs=config.groups.map(g=>{const gc=[...document.getElementById(g.id).querySelectorAll('.question-card')];const cc=gc.filter(c=>[...c.querySelectorAll('input:checked')].map(i=>i.value).sort().join('|')===c.dataset.answer).length;return{title:g.title,correct:cc,total:gc.length};});
  breakdown.innerHTML='<p class="text-xs font-bold mb-3" style="color:var(--muted)">Score breakdown by section</p>'+gs.map(s=>{const pct=s.total>0?Math.round(s.correct/s.total*100):0;const color=pct>=80?'#34d399':pct>=50?'#fbbf24':'#f87171';return `<div class="skill-bar-row"><span class="skill-name">${s.title.split('\u00b7')[0].trim().slice(0,15)}</span><div class="skill-bar-track"><div class="skill-bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="skill-score">${s.correct}/${s.total}</span></div>`;}).join('');
  breakdown.classList.add('show');
  // Firestore submit
  cmcTrack('drill_complete',{drill_slug:window.location.pathname.split('/').pop(),drill_title:config.title,drill_source:'biweek-planner',score_pct:Math.round(score/cards.length*100),correct_count:score,total_count:cards.length});;try{var _stoken=localStorage.getItem('cmc-student-token');var _sname=localStorage.getItem('cmc-student-name')||'';if(_stoken&&_sname){var _url='https://firestore.googleapis.com/v1/projects/creative-minds-cambodia/databases/(default)/documents/drill_attempts';var _body={fields:{drillSlug:{stringValue:window.location.pathname.split('/').pop()},drillTitle:{stringValue:config.title},drillSource:{stringValue:'biweek-planner'},studentName:{stringValue:_sname},scorePct:{integerValue:String(Math.round(score/cards.length*100))},correctCount:{integerValue:String(score)},totalCount:{integerValue:String(cards.length)},submittedAt:{timestampValue:new Date().toISOString()}}};fetch(_url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_stoken},body:JSON.stringify(_body)}).catch(function(e){})}}catch(e){}
  result.innerHTML=`\u2713 Score: ${score}/${cards.length} (${Math.round(score/cards.length*100)}%) \u2014 ${config.title}`;
  result.classList.remove('hidden');result.style.background='rgba(16,185,129,.1)';result.style.color='#6ee7b7';
  submitBtn.disabled=true;submitBtn.innerHTML='<i class="fas fa-check text-xs"></i> Submitted';
  result.scrollIntoView({behavior:'smooth',block:'center'});
}
</script>

<script>
(function(){
  var btn=document.getElementById('cmc-share-btn');
  var panel=document.getElementById('cmc-share-panel');
  if(!btn||!panel)return;
  btn.addEventListener('click',function(e){e.stopPropagation();panel.classList.toggle('open')});
  document.addEventListener('click',function(e){if(!panel.contains(e.target)&&e.target!==btn)panel.classList.remove('open')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')panel.classList.remove('open')});
  function buildURL(svc){
    var u=encodeURIComponent(window.location.href);
    var t=encodeURIComponent(document.title||'CMC Network practice page');
    if(svc==='facebook')return 'https://www.facebook.com/sharer/sharer.php?u='+u;
    if(svc==='x')return 'https://twitter.com/intent/tweet?url='+u+'&text='+t;
    if(svc==='whatsapp')return 'https://api.whatsapp.com/send?text='+t+'%20'+u;
    if(svc==='telegram')return 'https://t.me/share/url?url='+u+'&text='+t;
    if(svc==='linkedin')return 'https://www.linkedin.com/sharing/share-offsite/?url='+u;
    if(svc==='email')return 'mailto:?subject='+t+'&body='+u;
    return '#';
  }
  panel.querySelectorAll('a[data-share]').forEach(function(a){
    a.addEventListener('click',function(){
      var svc=a.getAttribute('data-share');
      if(svc==='email'){a.href=buildURL('email');return}
      a.href=buildURL(svc);cmcTrack('share_click',{service:svc});});
  });
  var copyBtn=document.getElementById('cmc-share-copy');
  if(copyBtn){
    copyBtn.addEventListener('click',function(){
      var label=copyBtn.querySelector('span');
      var done=function(){if(label){var orig=label.textContent;label.textContent='Copied!';setTimeout(function(){label.textContent=orig},1500)}};
      try{navigator.clipboard.writeText(window.location.href).then(done).catch(function(){done()});cmcTrack('share_click',{service:'copy_link'})}catch(e){done()}
    });
  }
})();
</script>
