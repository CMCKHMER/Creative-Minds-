.ag-t{font-size:20px;font-weight:700;letter-spacing:3px;opacity:0}.ag-t.gr{color:var(--ac);animation:agA .5s ease-out forwards}.ag-t.dn{color:var(--er);animation:agA .5s ease-out forwards}@keyframes agA{0%{opacity:0;transform:scale(.8)}30%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.hc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;transition:all .25s;overflow:hidden;position:relative}.hc:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.3);border-color:var(--cy)}.hc.done{border-color:rgba(16,185,129,.3)}.hc.done::after{content:'BREACHED';position:absolute;top:10px;right:10px;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--ac);background:rgba(16,185,129,.15);padding:2px 6px;border-radius:4px}

<body>
<canvas id="fx"></canvas>
<div class="amb" id="ambG"></div>

  <button class="tbi" id="pauseBtn" title="Pause (Esc)"><i class="fa-solid fa-pause"></i></button>
  <button class="tbi" id="settingsBtn" title="Settings"><i class="fa-solid fa-gear"></i></button>

<script>
/* === SECTION_1: SOUND SYSTEM === */
var sC=null, sVol=0.7, sMute=false;
try{sVol=parseFloat(localStorage.getItem('sc_vol'));if(isNaN(sVol))sVol=0.7;sMute=localStorage.getItem('sc_mute')==='1'}catch(e){}
function iS(){if(!sC)sC=new(window.AudioContext||window.webkitAudioContext)();if(sC.state==='suspended')sC.resume()}
function snd(t){if(!sC||sMute||sVol<=0)return;var n=sC.currentTime,v=sVol;
function tone(freq,dur,type,vol,dec){var o=sC.createOscillator(),g=sC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(vol*v,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(sC.destination);o.start(n);o.stop(n+dur)}
if(t==='click'){var o=sC.createOscillator(),g=sC.createGain();o.type='sine';o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(400,n+.05);g.gain.setValueAtTime(.06*v,n);g.gain.exponentialRampToValueAtTime(.001,n+.05);o.connect(g);g.connect(sC.destination);o.start(n);o.stop(n+.05)}

  var newUnlocks=[];
  for(var i=0;i<ACH.length;i++){
    var a=ACH[i];
    if(STATS.ach.indexOf(a.id)===-1&&a.check(STATS)){
      STATS.ach.push(a.id);
      newUnlocks.push(a);
    }
  }
  if(newUnlocks.length){
    saveStats();
    snd('achieve');
    var c=eC();
    confetti(c.x,c.y,80);
    for(var j=0;j<newUnlocks.length;j++){
      (function(a,delay){setTimeout(function(){toast('<b>Achievement Unlocked!</b><br>'+a.name+' — '+a.desc,a.icon)},delay*1200)})(newUnlocks[j],j);
    }
  }
}

/* Seeded random for Daily Challenge */
function seededRand(seed){var x=Math.sin(seed)*10000;return x-Math.floor(x)}
function pickSeeded(pool,seed,used){
  var avail=[];for(var i=0;i<pool.length;i++)if(!used[i])avail.push(i);
  if(!avail.length){return -1}
  var idx=Math.floor(seededRand(seed+GM.round)*avail.length);
  return avail[idx];
}

function genL(t){
  var pool=[];
  for(var i=0;i<DB.length;i++){if(DB[i].w&&DB[i].fx&&DB[i].fx!=='—'&&DB[i].d===t.diff)pool.push(DB[i])}
  if(pool.length<t.layers){
    for(var j=0;j<DB.length;j++){
      if(DB[j].w&&DB[j].fx&&DB[j].fx!=='—'&&Math.abs(DB[j].d-t.diff)<=1&&pool.indexOf(DB[j])===-1)pool.push(DB[j]);
    }
  }
  shuffle(pool);
  var res=[];
  for(var m=0;m<t.layers&&m<pool.length;m++){
    var s=pool[m],w=s.w.slice();
    w[s.e]='___';
    res.push({d:w.join(' '),a:s.fx,b:s.w[s.e]});
  }
  return res;
}

function createSheet(id){var el=document.createElement('div');el.className='sheet';el.id='sheet-'+id;document.body.appendChild(el);sheets[id]=el;return el}

function openSheet(id,param){
  iS();snd('click');
  if(activeSheet&&activeSheet!==id&&sheets[activeSheet])sheets[activeSheet].classList.remove('on');
  var el=sheets[id];if(!el)el=createSheet(id);
  document.getElementById('backBtn').classList.add('vis');
  document.getElementById('topBtns').classList.add('vis');
  activeSheet=id;
  var gameModes=['judge','fix','spot','survival','time','speed','daily','practice'];
  if(gameModes.indexOf(id)!==-1)initMode(id);
  if(id==='heist'&&param)doStartHeist(param);
  if(id==='hres')renderHRes();
  if(id==='over')renderOver(el);
  else renderSheet(id);
  setTimeout(function(){el.classList.add('on')},20);
  window.scrollTo(0,0);
}

function closeSheet(){
  if(activeSheet&&sheets[activeSheet])sheets[activeSheet].classList.remove('on');
  stopT();
  document.getElementById('backBtn').classList.remove('vis');
  document.getElementById('topBtns').classList.remove('vis');
  activeSheet=null;
  renderMenu();
}

function openModal(html){
  var m=document.getElementById('modalBg');
  document.getElementById('modalContent').innerHTML=html;
  m.classList.add('on');
  setTimeout(function(){m.style.opacity='1'},10);
}
function closeModal(){
  var m=document.getElementById('modalBg');
  m.style.opacity='0';
  setTimeout(function(){m.classList.remove('on')},250);
}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()});
/* === SECTION_9: GAME LOGIC === */
function initMode(mode){
  GM.mode=mode;
  GM.score=0;GM.streak=0;GM.best=0;
  GM.lives=(mode==='survival')?99:(mode==='practice'||mode==='time'||mode==='speed'||mode==='daily')?99:3;
  GM.round=0;GM.lv=1;GM.plv=1;GM.ans=false;GM.used={};
  GM.tc=0;GM.tw=0;GM.lastTk=0;
  GM.paused=false;
  GM.pool=getPool(mode);
  GM.comebackSinceLoss=0;
  if(mode==='time'){GM.timeLeft=60000;GM.timeStart=performance.now()}
  if(mode==='speed'){GM.speedStart=performance.now()}
  if(mode==='daily'){
    var d=new Date();
    GM.dailySeed=hash(dateStr(d));
    if(STATS.lastDaily===dateStr(d)){
      /* Already done today — show results directly */
      activeSheet='daily';
      renderSheet('daily');
      return;
    }
  }
  nextRound();
}

function pick(){
  var av=[];
  if(GM.mode==='daily'){
    /* Use seeded picking */
    for(var i=0;i<GM.pool.length;i++)if(!GM.used[i])av.push(i);
    if(av.length<3){GM.used={};return pick()}
    var idx=av[Math.floor(seededRand(GM.dailySeed+GM.round)*av.length)];
    GM.used[idx]=true;return GM.pool[idx];
  }
  for(var i=0;i<GM.pool.length;i++){if(GM.pool[i].d===GM.lv&&!GM.used[i])av.push(i)}
  if(av.length<3&&GM.lv>1)for(var j=0;j<GM.pool.length;j++){if(GM.pool[j].d===GM.lv-1&&!GM.used[j]&&av.indexOf(j)===-1)av.push(j)}
  if(av.length<3&&GM.lv<3)for(var k=0;k<GM.pool.length;k++){if(GM.pool[k].d===GM.lv+1&&!GM.used[k]&&av.indexOf(k)===-1)av.push(k)}
  if(av.length<2){GM.used={};return pick()}
  var idx=av[Math.floor(Math.random()*av.length)];
  GM.used[idx]=true;return GM.pool[idx];
}

function mkOpts(c){
  var opts=[{text:c,correct:true}];
  var pl=['its',"it's",'their',"they're",'your',"you're",'were','was','have','has','is','are',"don't","doesn't",'less','fewer','who','whom','effect','affect','bad','badly','lay','laid','I','me','him','he','There','Their','then','than','a','an','were','was','have','has','any','nothing','nobody'];
  var tr=0;
  while(opts.length<4&&tr<40){
    var w=pl[Math.floor(Math.random()*pl.length)];
    var dp=false;
    for(var i=0;i<opts.length;i++){if(opts[i].text.toLowerCase()===w.toLowerCase())dp=true}
    if(!dp&&w.toLowerCase()!==c.toLowerCase())opts.push({text:w,correct:false});
    tr++;
  }
  shuffle(opts);
  return opts;
}

function nextRound(){
  GM.round++;
  GM.plv=GM.lv;
  GM.lv=gLv(GM.round);
  GM.cur=pick();
  GM.ans=false;
  if(GM.mode==='fix'&&GM.cur&&GM.cur.w)GM.opts=mkOpts(GM.cur.fx);
  else if(GM.mode==='spot'&&GM.cur&&GM.cur.w){
    GM.opts=[];
    for(var i=0;i<GM.cur.w.length;i++)GM.opts.push({text:GM.cur.w[i],idx:i});
  }
  else GM.opts=[];
  if(GM.mode==='time')GM.td=Math.max(5000,12000-Math.floor(GM.round*200));
  else if(GM.mode==='speed')GM.td=10000;
  else if(GM.mode==='daily')GM.td=8000;
  else startT(TD[GM.lv-1]);
}

function doWin(){
  GM.streak++;
  if(GM.streak>GM.best)GM.best=GM.streak;
  GM.tc++;
  STATS.totalRounds++;
  if(GM.streak>STATS.bestStreak)STATS.bestStreak=GM.streak;
  var el=performance.now()-GM.ts;
  if(STATS.fastestRound===0||el<STATS.fastestRound)STATS.fastestRound=el;
  /* Track rules seen */
  if(GM.cur&&!GM.cur.c){
    var an=valG(GM.cur.t);
    if(an.errors.length){
      var rule=an.errors[0].rule;
      if(STATS.rulesSeen.indexOf(rule)===-1)STATS.rulesSeen.push(rule);
    }
  }
  /* Track comeback */
  if(GM.comebackSinceLoss>0)GM.comebackSinceLoss++;
  if(GM.comebackSinceLoss>STATS.comeback)STATS.comeback=GM.comebackSinceLoss;
  snd('correct');
  var tr=Math.max(0,GM.td-el),tb=Math.floor(tr/1000)*10,sb=Math.min(GM.streak,10)*20,pt=Math.floor((100+tb+sb)*DM[GM.lv]);
  GM.score+=pt;
  return pt;
}

function doLose(){
  GM.streak=0;
  GM.tw++;
  snd('wrong');
  GM.comebackSinceLoss=0;
  if(GM.mode!=='survival'&&GM.mode!=='practice'&&GM.mode!=='time'&&GM.mode!=='speed'&&GM.mode!=='daily')GM.lives--;
}

function hJ(pc){
  if(GM.ans||GM.paused)return;
  GM.ans=true;stopT();snd('click');
  var s=GM.cur,pr=pc===(s.c===true),an=valG(s.t),ct=eC();
  if(pr){var pt=doWin();spB(ct.x,ct.y,'#10b981',25);showR('correct',an,pt)}
  else{doLose();trigG();spB(ct.x,ct.y,'#f85149',20);showR('wrong',an,0);if(GM.lives<=0){setTimeout(function(){snd('over');endGame()},2200);return}}
  renderSheet(GM.mode);
}

function hFi(oi){
  if(GM.ans||GM.paused)return;
  GM.ans=true;stopT();snd('click');
  var opt=GM.opts[oi],ct=eC();
  if(opt.correct){var pt=doWin();spB(ct.x,ct.y,'#10b981',25);showFR('correct',opt)}
  else{doLose();trigG();spB(ct.x,ct.y,'#f85149',20);showFR('wrong',opt);if(GM.lives<=0){setTimeout(function(){snd('over');endGame()},2200);return}}
  renderSheet(GM.mode);
}

function hSp(wi){
  if(GM.ans||GM.paused)return;
  GM.ans=true;stopT();snd('click');
  var ct=eC();
  if(wi===GM.cur.e){var pt=doWin();spB(ct.x,ct.y,'#10b981',25);showSR('correct')}
  else{doLose();trigG();spB(ct.x,ct.y,'#f85149',20);showSR('wrong');if(GM.lives<=0){setTimeout(function(){snd('over');endGame()},2200);return}}
  renderSheet(GM.mode);
}

function hTm(){
  if(GM.ans||GM.paused)return;
  GM.ans=true;GM.streak=0;GM.tw++;snd('wrong');spB(eC().x,eC().y,'#d29922',18);
  if(GM.mode==='survival'||GM.mode==='time'||GM.mode==='speed'||GM.mode==='daily')GM.lives=0;
  else if(GM.mode!=='practice')GM.lives--;
  GM.comebackSinceLoss=0;
  if(GM.mode==='fix')showFR('timeout',null);
  else if(GM.mode==='spot')showSR('timeout');
  else showR('timeout',valG(GM.cur.t),0);
  if(GM.lives<=0){setTimeout(function(){snd('over');endGame()},2200)}
}

function showR(type,an,pts){
  var card=document.getElementById('edC'),gl=document.getElementById('ambG'),out=document.getElementById('cO'),btns=document.getElementById('jB');
  if(btns)btns.style.display='none';
  out.classList.add('on');
  var s=GM.cur,h='';
  if(type==='correct'){
    card.classList.add('gg');gl.classList.remove('em');
    if(pts>0)sSP('+'+pts,'var(--ac)');
    h+='<div class="cl"><span class="cp">&gt;</span> Compiling...</div>';
    if(s.c){
      h+='<div class="cl"><span class="cs">&#10003;</span> Build successful</div>';
    } else if(an.errors.length>0){
      var e=an.errors[0];
      h+='<div class="cl"><span class="cs">&#10003;</span> Bug: <span class="cw">'+e.rule+'</span></div><div class="cl"><span class="cm">&nbsp;&nbsp;'+esc(e.explanation)+'</span></div>';
    } else if(s.fx){
      h+='<div class="cl"><span class="cs">&#10003;</span> Bug found — fix: <span style="color:var(--ac)">'+esc(s.fx)+'</span></div>';
    } else {
      h+='<div class="cl"><span class="cs">&#10003;</span> Bug found</div>';
    }
    h+='<div class="cl"><span class="cm">&nbsp;&nbsp;+'+pts+' pts'+(GM.streak>1?' ('+GM.streak+'x)':'')+'</span></div>';
  } else {
    card.classList.add('gr','shk');gl.classList.add('em');
    h+='<div class="cl"><span class="cp">&gt;</span> Compiling...</div>';
    h+=type==='timeout'?'<div class="cl"><span class="cer">&#10007;</span> TimeoutError</div>':'<div class="cl"><span class="cer">&#10007;</span> Wrong judgment</div>';
    if(!s.c){
      if(an.errors.length>0){
        var e2=an.errors[0];
        h+='<div class="cl"><span class="cm">&nbsp;&nbsp;HAS error — <span class="cw">'+e2.rule+'</span></span></div><div class="cl"><span class="cm">&nbsp;&nbsp;'+esc(e2.explanation)+'</span></div>';
      } else if(s.fx){
        h+='<div class="cl"><span class="cm">&nbsp;&nbsp;Has an error — fix: <span style="color:var(--ac)">'+esc(s.fx)+'</span></span></div>';
      } else {
        h+='<div class="cl"><span class="cm">&nbsp;&nbsp;Has an error</span></div>';
      }
    }
    else h+='<div class="cl"><span class="cm">&nbsp;&nbsp;Actually correct</span></div>';
    if(GM.mode!=='survival'&&GM.mode!=='practice'&&GM.mode!=='time'&&GM.mode!=='speed'&&GM.mode!=='daily')h+='<div class="cl"><span class="cer">&nbsp;&nbsp;-1 life</span></div>';
    brkH();
  }
  out.innerHTML=h;
  if(GM.lives>0)setTimeout(function(){card.classList.remove('gg','gr','shk');gl.classList.remove('em');nextRound();renderSheet(GM.mode)},2000);
}

function mkFB(ct){var b=document.querySelectorAll('#jB .ck');for(var i=0;i<b.length;i++){b[i].classList.add('dis');if(b[i].getAttribute('data-v')===ct)b[i].classList.add('crr')}}
function mkSB(ci){var b=document.querySelectorAll('#jB .ck');for(var i=0;i<b.length;i++){b[i].classList.add('dis');if(parseInt(b[i].getAttribute('data-i'))===ci)b[i].style.borderColor='var(--er)'}}

function startT(dur){
  GM.td=dur;GM.ts=performance.now();GM.lastTk=0;uT();
  /* For time attack, separate timer */
  if(GM.mode==='time'&&!GM.timeRAF){
    GM.timeStart=performance.now()-((GM.mode==='time')?(60000-GM.timeLeft):0);
    uTTime();
  }
  if(GM.mode==='speed'&&!GM.speedRAF){uTTime()}
}
function uT(){
  if(GM.ans||GM.paused)return;
  var el=performance.now()-GM.ts;
  var pct=Math.max(0,1-el/GM.td);
  var bar=document.getElementById('tFl');
  if(bar){bar.style.width=(pct*100)+'%';bar.classList.toggle('dg',pct<.25)}
  if(pct<=0){hTm();return}
  GM.tr=requestAnimationFrame(uT);
}
function stopT(){cancelAnimationFrame(GM.tr);cancelAnimationFrame(GM.timeRAF);GM.timeRAF=null;GM.speedRAF=null}

function uTTime(){
  if(GM.paused)return;
  if(GM.mode==='time'){
    var elapsed=performance.now()-GM.timeStart;
    GM.timeLeft=Math.max(0,60000-elapsed);
    var bar=document.getElementById('gT');
    if(bar)bar.style.width=(GM.timeLeft/60000*100)+'%';
    var td=document.getElementById('gTVal');
    if(td)td.textContent=Math.ceil(GM.timeLeft/1000)+'s';
    if(GM.timeLeft<=0){endGame();return}
    GM.timeRAF=requestAnimationFrame(uTTime);
  } else if(GM.mode==='speed'){
    var el=performance.now()-GM.speedStart;
    var bar=document.getElementById('gT');
    if(bar)bar.textContent=fmtTime(el);
    GM.speedRAF=requestAnimationFrame(uTTime);
  }
}

function endGame(){
  stopT();
  /* Save mode stats */
  if(GM.mode){
    STATS.modeScores[GM.mode]=(STATS.modeScores[GM.mode]||0)+GM.score;
    STATS.modePlays[GM.mode]=(STATS.modePlays[GM.mode]||0)+1;
  }
  if(GM.mode==='survival'&&GM.round>STATS.survivalBest)STATS.survivalBest=GM.round;
  /* Track perfect games */
  var total=GM.tc+GM.tw;
  var acc=total>0?Math.round(GM.tc/total*100):0;
  if(acc>=90&&total>=10)STATS.perfectGames++;
  /* Daily challenge */
  if(GM.mode==='daily'){
    var d=new Date();
    if(STATS.lastDaily!==dateStr(d)){
      STATS.lastDaily=dateStr(d);
      STATS.dailyDone=(STATS.dailyDone||0)+1;
    }
  }
  /* Track history */
  STATS.history.unshift({mode:GM.mode,score:GM.score,rounds:GM.round,acc:acc,date:Date.now()});
  if(STATS.history.length>20)STATS.history.pop();
  saveStats();
  checkAch();
  openSheet('over');
}
/* === SECTION_10: RENDERERS === */
function renderSheet(id){
  var el=sheets[id];if(!el)return;
  var gameModes=['judge','fix','spot','survival','time','speed','daily','practice'];
  if(gameModes.indexOf(id)!==-1)renderGame(el,id);
  else if(id==='heist')renderHeist();
  else if(id==='over')renderOver(el);
}

function submitH(){

function showReference(){

  var refs=[
    {t:'Subject-Verb Agreement',b:'A verb must agree with its subject in number. Singular subjects take singular verbs (he runs, she has, it is). Plural subjects take plural verbs (they run, we have, you are). Watch out for collective plurals like "children", "people", "police" — they\'re always plural.'},
    {t:'Pronoun Case (I vs me)',b:'Use "I" / "he" / "she" / "they" as the SUBJECT of a verb. Use "me" / "him" / "her" / "them" as the OBJECT. After prepositions (between, for, to, with, by), always use the object form: "between you and me" (not "I"). In compound subjects, put yourself last: "My friend and I went."'},
    {t:'Their / They\'re / There',b:'"Their" = possessive ("their house"). "They\'re" = "they are" ("they\'re going"). "There" = location or existential ("there is a problem"). Saying "their going" or "their are many" mixes these up.'},
    {t:'Your / You\'re',b:'"Your" = possessive ("your book"). "You\'re" = "you are" ("you\'re welcome"). "Your welcome" is wrong — it should be "you\'re welcome".'},
    {t:'Its / It\'s',b:'"Its" = possessive ("its fur", "its name"). "It\'s" = "it is" ("it\'s raining"). Possessive pronouns don\'t take apostrophes: his, hers, its, ours, theirs.'},
    {t:'Could/Would/Should of',b:'The correct phrase is "could have", "would have", "should have". The contracted form "could\'ve" sounds like "could of", which is wrong. Always use "have".'},
    {t:'Less vs Fewer',b:'Use "fewer" with COUNTABLE nouns (fewer students, fewer books, fewer apples). Use "less" with UNCOUNTABLE nouns (less water, less money, less time). Supermarket "10 items or less" is actually grammatically wrong!'},
    {t:'Subjunctive Mood',b:'After "wish" or in hypothetical "if" clauses, use "were" for all subjects: "I wish I were taller", "If I were you", "If she were here". The indicative "was" is wrong in these contexts.'},
    {t:'Lay vs Lie',b:'"Lie" (recline) — present: lie / past: lay / participle: lain. "Lay" (put) — present: lay / past: laid / participle: laid. So "The dog lay on the rug" (past tense of "lie"). "She laid the book down" (past tense of "lay").'},
    {t:'Then vs Than',b:'"Then" refers to TIME or SEQUENCE ("first this, then that"). "Than" is for COMPARISONS ("better than", "faster than"). "She is taller then me" is wrong.'},
    {t:'Who vs Whom',b:'"Who" is the SUBJECT of a verb ("Who is there?"). "Whom" is the OBJECT ("To whom did you speak?"). Quick test: try replacing with "he" or "him" — if "him" fits, use "whom".'},
    {t:'Affect vs Effect',b:'"Affect" is usually a VERB meaning "to influence" ("The weather affects my mood"). "Effect" is usually a NOUN meaning "the result" ("The effect was immediate").'},
    {t:'Collective Nouns',b:'Words like committee, team, family, jury, audience are usually SINGULAR in American English ("The team is winning"). Treat them as a single unit.'},
    {t:'Foreign Plurals',b:'Many borrowed Latin/Greek words have irregular plurals: criterion→criteria, phenomenon→phenomena, datum→data, medium→media, analysis→analyses, thesis→theses. The plural form takes a plural verb.'},
    {t:'Comparative & Superlative',b:'Short adjectives add -er / -est (big → bigger → biggest). Long adjectives use more / most (beautiful → more beautiful → most beautiful). NEVER combine: "more bigger" or "most best" are wrong.'},
    {t:'Double Negatives',b:'Two negatives cancel out, making the meaning positive. "I don\'t have no money" technically means "I do have money". Use one negative: "I don\'t have any money" or "I have no money".'},
    {t:'A vs An',b:'Use "an" before VOWEL SOUNDS ("an apple", "an hour" - silent h). Use "a" before CONSONANT SOUNDS ("a university" - starts with /y/ sound, "a one-way street").'},
    {t:'Each / Every',b:'"Each" and "every" are SINGULAR even when followed by a plural noun: "Each of the students has a book", "Every one of the players has a jersey".'},
    {t:'Neither / Either',b:'"Neither of" and "Either of" take SINGULAR verbs: "Neither of the options is good". Though informal speech often uses plural, formal grammar prefers singular.'}
  ];
  var cats=refs.map(function(r,i){
    return '<div class="ref-cat'+(i===0?' open':'')+'"><div class="ref-hd" onclick="this.parentElement.classList.toggle(\'open\')"><span>'+r.t+'</span><i class="fa-solid fa-chevron-right ref-chev"></i></div><div class="ref-bd">'+r.b+'</div></div>';
  }).join('');
  html+=cats;
  html+='<div class="text-center mt-4"><button class="bp2" onclick="closeModal()">Close</button></div>';
  openModal(html);
}

document.getElementById('backBtn').addEventListener('click',closeSheet);
document.getElementById('pauseBtn').addEventListener('click',togglePause);

document.getElementById('muteBtn').addEventListener('click',function(){
  sMute=!sMute;
  try{localStorage.setItem('sc_mute',sMute?'1':'0')}catch(e){}
  var btn=document.getElementById('muteBtn');
  if(btn)btn.innerHTML='<i class="fa-solid '+(sMute?'fa-volume-xmark':'fa-volume-high')+'"></i>';
  if(!sMute){iS();snd('click')}
});

document.addEventListener('keydown',function(e){
  /* Close modal on Esc */
  if(e.key==='Escape'){
    var m=document.getElementById('modalBg');
    if(m.classList.contains('on')){closeModal();return}
    /* Toggle pause in game */
    if(activeSheet&&['judge','fix','spot','survival','time','speed','daily','practice'].indexOf(activeSheet)!==-1&&!GM.ans){
      togglePause();
    }
    return;
  }
  if(e.key==='m'||e.key==='M'){
    if(e.target.tagName!=='INPUT'){
      sMute=!sMute;
      try{localStorage.setItem('sc_mute',sMute?'1':'0')}catch(e){}
      var btn=document.getElementById('muteBtn');
      if(btn)btn.innerHTML='<i class="fa-solid '+(sMute?'fa-volume-xmark':'fa-volume-high')+'"></i>';
      if(!sMute){iS();snd('click')}
    }
    return;
  }
  if(activeSheet&&(activeSheet==='judge'||activeSheet==='fix'||activeSheet==='spot'||activeSheet==='survival'||activeSheet==='time'||activeSheet==='speed'||activeSheet==='daily'||activeSheet==='practice')&&!GM.ans&&!GM.paused){
    if(activeSheet==='judge'||activeSheet==='survival'||activeSheet==='time'||activeSheet==='speed'||activeSheet==='daily'||activeSheet==='practice'){
      if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft'){e.preventDefault();hJ(false)}
      else if(e.key==='d'||e.key==='D'||e.key==='ArrowRight'){e.preventDefault();hJ(true)}
      else if(e.key==='s'||e.key==='S'){if(activeSheet==='time'||activeSheet==='speed'||activeSheet==='practice'){e.preventDefault();skipRound()}}
    }
    else if(activeSheet==='fix'){
      var n=parseInt(e.key);
      if(n>=1&&n<=GM.opts.length){e.preventDefault();hFi(n-1)}
    }
    else if(activeSheet==='spot'){
      var n2=parseInt(e.key);
      if(n2>=1&&n2<=GM.cur.w.length){e.preventDefault();hSp(n2-1)}
    }
  }
  if(activeSheet==='over'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();closeSheet();openSheet(GM.mode)}
});

createSheet('hres');
createSheet('over');
renderMenu();
