<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg-l)"/>
  <rect width="400" height="200" fill="url(#glow-l)"/>
  <!-- Sound waves / waveform -->
  <g opacity="0.35" stroke="#a855f7" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="22" y1="100" x2="22" y2="100"/>
    <line x1="38" y1="80" x2="38" y2="120"/>
    <line x1="54" y1="60" x2="54" y2="140"/>
    <line x1="70" y1="70" x2="70" y2="130"/>
    <line x1="86" y1="40" x2="86" y2="160"/>
    <line x1="102" y1="50" x2="102" y2="150"/>
    <line x1="118" y1="80" x2="118" y2="120"/>
    <line x1="134" y1="65" x2="134" y2="135"/>
    <line x1="150" y1="90" x2="150" y2="110"/>
    <line x1="166" y1="60" x2="166" y2="140"/>
    <line x1="182" y1="70" x2="182" y2="130"/>
    <line x1="198" y1="50" x2="198" y2="150"/>
  </g>
  <!-- Headphones silhouette bottom-right -->
  <g opacity="0.14" fill="none" stroke="#a855f7" stroke-width="3" transform="translate(240,40)">
    <path d="M10,80 Q10,10 60,10 Q110,10 110,80"/>
    <rect x="0" y="70" width="20" height="32" rx="6" fill="#a855f7" opacity="0.7"/>
    <rect x="100" y="70" width="20" height="32" rx="6" fill="#a855f7" opacity="0.7"/>
  </g>
  <!-- Accent dot -->
  <circle cx="32" cy="32" r="4" fill="#a855f7" opacity="0.4"/>
</svg>
